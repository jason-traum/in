<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan tomorrow's run with friends on the Schuylkill River Trail.">
<meta property="og:title" content="In.">
<meta property="og:description" content="Plan tomorrow's run with friends on the Schuylkill River Trail.">
<meta name="theme-color" content="#1E5F55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="In.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* ============================================================================================
   In. DESIGN RULES (approved Sep 27, 2026). Read before changing any feature, and keep them.
   1. Riverside base: pale green canvas (--bg), white run surfaces (--surface), deep green actions (--green).
   2. Every run sits on its own white surface: 14px radius, 12-16px padding, hairline border, faint shadow.
      No nested cards, no heavy outlines. Lists that belong together (friends, your other runs) share one
      surface with hairline dividers. Don't flatten everything into divided rows on the canvas.
   3. The strongest treatment is reserved for your commitment: the solid green "Your run" card at the top,
      and a green edge plus a "Joined" chip on the joined row. Browsing rows stay plain white.
   4. Actions: "I'm in" (confirmed) is solid deep green with white text. "I'd be in" (proposed) is outlined.
      Joined and hosting states are explicit chips, never pale look-alike buttons.
   5. Condensed type (Saira Condensed) only for the wordmark and start times. Start times outrank day labels;
      day labels are small body-font labels.
   6. Keep: run titles that describe the run, pace and distance on their own readable line, who's going and
      who's hosting, and the Friends / Friends of friends / All Wharton selector. Route and host lines are
      secondary (--ink-2), never faint.
   7. Keep the space above the first run short: header, tabs, one compact audience selector, a small day label,
      one-sentence confirmation rule with "How it works". Explain sorting once.
   8. Sample content carries a compact "Sample" tag. No dotted names, no explanatory paragraphs above the feed.
   9. Check at 320 and 390 px with a deliberately long title. No sideways scroll.
   ============================================================================================ */
:root{
  --bg:#EAF2EE;--surface:#FFFFFF;--ink:#15302A;--ink-2:#34493F;--muted:#5A6B63;--hair:#D6E3DC;--fill:#E1EBE6;
  --green:#1E5F55;--green-hover:#174C44;--on-green:#FFFFFF;--on-green-2:#CFE3DD;--green-soft:#DAEBE3;--green-text:#1A5A4F;
  --warm:#9A4A16;--scrim:rgba(18,34,29,.42);--shadow:0 1px 2px rgba(21,48,42,.06),0 1px 1px rgba(21,48,42,.03);
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513;--surface:#17201D;--ink:#E7EFEB;--ink-2:#C0CCC6;--muted:#93A39B;--hair:#25312C;--fill:#1D2824;
    --green:#5DB3A3;--green-hover:#76C4B5;--on-green:#0B1A17;--on-green-2:#1E3D37;--green-soft:#1A2F29;--green-text:#80CABB;
    --warm:#E0A06C;--scrim:rgba(0,0,0,.62);--shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513;--surface:#17201D;--ink:#E7EFEB;--ink-2:#C0CCC6;--muted:#93A39B;--hair:#25312C;--fill:#1D2824;
  --green:#5DB3A3;--green-hover:#76C4B5;--on-green:#0B1A17;--on-green-2:#1E3D37;--green-soft:#1A2F29;--green-text:#80CABB;
  --warm:#E0A06C;--scrim:rgba(0,0,0,.62);--shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,p,dl,dd,figure{margin:0}
ul{list-style:none;margin:0;padding:0}
.boot{padding:48px 16px;color:var(--muted)}
.muted{color:var(--muted)}
.ic{flex:none;display:inline-block;vertical-align:-2px}
.sample-tag{display:inline-block;margin-left:7px;padding:1px 7px;border:1px solid var(--hair);border-radius:999px;background:var(--fill);color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.5;vertical-align:1px;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--hair)}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.mark{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:baseline}
.mark .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-left:3px}
.brand-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-chip{align-self:center;margin-left:-4px;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-text);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.me-btn{border:0;background:none;padding:0;border-radius:50%;display:grid;place-items:center;min-width:40px;min-height:40px}
.me-setup{font-size:13px;font-weight:600;border:1px solid var(--ink);border-radius:999px;padding:7px 12px;white-space:nowrap}
@media (max-width:520px){.brand-sub{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 16px;border-radius:999px;border:1.5px solid transparent;background:none;font-weight:600;font-size:14px;line-height:1;white-space:nowrap;transition:background-color .12s ease-out,color .12s ease-out,border-color .12s ease-out}
.btn-go{background:var(--green);color:var(--on-green)}
.btn-go:hover{background:var(--green-hover)}
.btn-in{background:var(--green-soft);color:var(--green-text)}
.btn-in:hover{background:color-mix(in srgb,var(--green) 20%,var(--surface))}
.btn-maybe{border-color:var(--green);color:var(--green-text);background:var(--surface)}
.btn-maybe:hover{background:var(--green-soft)}
.btn-line{border-color:var(--hair);background:var(--surface);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-text{padding-inline:6px;color:var(--ink-2);font-weight:500}
.btn-text:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.btn-danger{color:var(--warm)}
.btn-sm{min-height:36px;padding:7px 14px;font-size:13.5px}
.btn-lg{min-height:48px;font-size:16px;padding-inline:22px}
.linkish{background:none;border:0;padding:0;color:var(--green-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* page */
.wrap{max-width:680px;margin:0 auto;padding:0 16px 96px}
.tabs{display:flex;gap:24px;margin-top:4px;border-bottom:1px solid var(--hair)}
.tab{background:none;border:0;padding:8px 0 10px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:hover{color:var(--ink)}
.badge{background:var(--green);color:var(--on-green);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:inline-grid;place-items:center;padding:0 5px;line-height:1}
.noteline{font-size:13px;color:var(--muted);margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.setup{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow)}
.setup span{flex:1 1 220px}

/* your run: the one strong block on the page */
.yours{margin-top:16px;display:grid;gap:6px}
.yr{background:var(--green);color:var(--on-green);border-radius:16px;padding:16px 18px 14px;display:grid;gap:2px;animation:yr-in .3s ease-out}
@keyframes yr-in{from{opacity:0;transform:translateY(6px)}}
.yr-k{font-size:13px;font-weight:600;color:var(--on-green-2)}
.yr-time{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.yr-time small{font-size:22px;font-weight:600}
.yr-around{font-family:var(--f-body);font-size:15px;font-weight:500;margin-right:2px}
.yr-t{font-size:19px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;margin-top:2px}
.yr-pace{font-size:15.5px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:3px}
.yr-l{font-size:14px;color:var(--on-green-2);overflow-wrap:anywhere}
.yr-soc{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.yr .stack .av{outline-color:var(--green)}
.yr .av{background:var(--on-green-2);color:var(--green)}
.yr .av.me{background:var(--on-green);color:var(--green)}
.yr .av.sample{background:var(--green);color:var(--on-green);box-shadow:inset 0 0 0 1.5px var(--on-green-2)}
.yr-sub{font-size:13.5px;color:var(--on-green-2);margin-top:6px;max-width:56ch}
.yr-foot{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.24);border-top-color:color-mix(in srgb,var(--on-green) 24%,transparent)}
.yr-trip{font-size:14.5px;font-weight:600}
.yr-trip-m,.trip-m{display:block;font-size:12.5px;font-weight:500;opacity:.85;margin-top:2px}
.yr-act{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn-inv{background:var(--on-green);color:var(--green)}
.btn-inv-line{border-color:var(--on-green-2);color:var(--on-green)}
.btn-inv-line:hover{background:color-mix(in srgb,var(--on-green) 12%,transparent)}
.yr.tent{background:var(--green-soft);color:var(--ink)}
.yr.tent .yr-k{color:var(--green-text)}
.yr.tent .yr-l,.yr.tent .yr-sub{color:var(--ink-2)}
.yr.tent .stack .av{outline-color:var(--green-soft)}
.yr.tent .av{background:var(--surface);color:var(--green-text)}
.yr.tent .av.me{background:var(--green);color:var(--on-green)}
.yr.tent .av.sample{background:var(--green-soft);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--muted)}
.yr.tent .yr-foot{border-top-color:color-mix(in srgb,var(--green) 22%,transparent)}
.yr.tent .btn-inv{background:var(--green);color:var(--on-green)}
.yr.tent .btn-inv-line{border-color:var(--green);color:var(--green-text)}
.yr.drop{background:var(--fill);color:var(--ink-2)}
.yr.drop .yr-k{color:var(--warm)}
.yr.drop .yr-l,.yr.drop .yr-sub{color:var(--ink-2)}
.yr.drop .stack .av{outline-color:var(--fill)}
.yr.drop .yr-foot{border-top-color:var(--hair)}
.yr.drop .btn-inv-line{border-color:var(--hair);color:var(--ink);background:var(--surface)}
.yr-more{display:grid;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.yr-more-b{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:11px 0;color:inherit}
.yr-more li:last-child .yr-more-b{border-bottom:0}
@media (hover:hover){.yr-more-b:hover .yr-more-n{text-decoration:underline;text-underline-offset:3px}}
.yr-more-t{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.yr-more-n{font-weight:500;overflow-wrap:anywhere}
.yr-more-s{font-size:12.5px;color:var(--green-text);font-weight:600;white-space:nowrap}
.controls{margin-top:12px}
.controls.after-yours{margin-top:24px}
.find-l{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.segc{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;box-shadow:var(--shadow)}
.segc button{flex:1 1 auto;min-height:32px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap}
.segc button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.segc button:not([aria-pressed="true"]):hover{background:var(--fill)}
@media (max-width:360px){.segc button{padding:0 7px;font-size:12.5px}}
.controls + .day,.controls + .empty + .day{margin-top:16px}
.corner{display:flex;align-items:center;gap:8px}
.corner select{flex:1 1 0;min-width:0}
.corner span{color:var(--muted);font-weight:600}

/* run list: each run on its own white surface */
.day{margin-top:22px}
.day-h{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.day-h h2{font-size:15px;font-weight:700;line-height:1.3}
.day-d{font-size:14px;color:var(--muted)}
.day-sort{margin-left:auto;font-size:12.5px;color:var(--muted)}
.rule{margin-top:3px;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.rule-left{color:var(--muted)}
.rule-more{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--fill);color:var(--ink-2)}
.rows{display:grid;gap:10px;margin-top:10px}
.row{position:relative;display:grid;gap:1px;padding:12px 16px 14px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);scroll-margin-top:90px}
.row.mine{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.row.faded{opacity:.6}
.row-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.row-time{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.row-time b{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:12.5px;font-weight:700;color:var(--warm);letter-spacing:.02em}
.row-act{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:2px}
.row-act .btn-text{padding-inline:10px}
.row-act .btn{min-height:40px;padding-inline:16px}
.title{font-size:16.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;margin-top:2px}
.row-link{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row-link::after{content:"";position:absolute;inset:0;border-radius:14px}
.row-link:focus-visible{outline:none}
.row-link:focus-visible::after{outline:2px solid var(--green);outline-offset:2px}
@media (hover:hover){.row:hover .row-link{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}}
.pace{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.where{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.social{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-top:7px}
.social > span:last-child,.yr-soc > span:last-child{flex:1 1 auto;min-width:0}
.nw{white-space:nowrap}
.state-chip{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--fill);color:var(--ink-2);font-size:13.5px;font-weight:700;white-space:nowrap}
.state-chip.in{background:var(--green-soft);color:var(--green-text)}
.row-note{font-size:13px;color:var(--muted);padding:8px 2px;white-space:nowrap}
.empty{font-size:14px;color:var(--muted);margin-top:10px}
.hidden-line{font-size:13.5px;color:var(--muted);margin-top:28px;max-width:62ch}
.skel-row{height:128px;border-radius:14px;background:linear-gradient(90deg,var(--surface),var(--fill),var(--surface));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* avatars */
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--green-soft);color:var(--green-text);font-weight:700;flex:none;object-fit:cover;line-height:1;letter-spacing:.02em}
.av.me{background:var(--green);color:var(--on-green)}
.av.sample{background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--muted)}
.stack{display:inline-flex;flex:none}
.stack .av{margin-left:-2px;outline:2px solid var(--surface)}
.stack .av:first-child{margin-left:0}
.sheet .stack .av{outline-color:var(--surface)}

/* run detail */
.detail{display:grid;gap:14px}
.d-state{font-size:13px;font-weight:600;color:var(--green-text)}
.d-state.prop{color:var(--warm)}
.d-title{font-size:22px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;margin-top:-6px}
.d-time{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;margin-top:-2px}
.d-time small{font-size:22px;font-weight:600}
.d-around{font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--muted);margin-right:2px}
.d-pace{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:-6px}
.d-next{font-size:14px;color:var(--ink-2);max-width:60ch}
.d-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.in-mark{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--green-text);min-height:40px}
.in-mark i{width:10px;height:10px;border-radius:50%;background:var(--green)}
.in-mark.maybe{color:var(--ink-2)}
.in-mark.maybe i{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.chat{display:grid;gap:10px;border-top:1px solid var(--hair);padding-top:14px}
.chat-h{margin:0;font-size:15px;font-weight:700}
.chat-list{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-height:320px;overflow:auto}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg-b{min-width:0;flex:1}
.msg-h{margin:0;font-size:12.5px;color:var(--muted)}
.msg-h b{color:var(--ink);font-size:13.5px;margin-right:4px}
.msg-x{font-size:12.5px;margin-left:8px}
.msg-text{margin:2px 0 0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-form{display:flex;gap:8px;align-items:flex-end}
.chat-form textarea{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;resize:vertical;min-height:46px}
.chat-form textarea:focus{border-color:var(--green);outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.d-rows{display:grid;border-top:1px solid var(--hair)}
.d-rows > div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.d-rows dt{font-size:13px;color:var(--muted)}
.d-rows dd{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.d-rows .m{display:block;font-size:12.5px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.trip{display:grid;gap:4px}
.trip-sum{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
.trip-sum p{font-size:15px;font-weight:600}
.legs{display:grid;gap:3px;padding-top:2px}
.leg-h{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:10px}
.leg-h:first-child{margin-top:4px}
.leg{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px;font-size:14px;align-items:baseline}
.leg .n{text-align:right;font-variant-numeric:tabular-nums}
.leg .m{color:var(--muted)}
.leg-tot{border-top:1px solid var(--ink);margin-top:10px;padding-top:7px;font-weight:600}
.legs .hint{margin-top:8px}
.trip-mode{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:8px}
.trip-mode .seg button{min-height:36px;padding:6px 14px;font-size:13.5px}

/* friends */
.section-title{font-size:15px;font-weight:700;margin:24px 0 8px;line-height:1.3}
.count{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
.flist{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:0 16px;box-shadow:var(--shadow)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.flist .prow:last-child{border-bottom:0}
.pi{flex:1 1 170px;min-width:0}
.pn{font-weight:600}
.pm{font-size:13px;color:var(--muted)}
.pa{display:flex;gap:4px;align-items:center;margin-left:auto}
.pending{font-size:13px;color:var(--muted);padding-inline:6px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search:focus-within{border-color:var(--green)}
.search input[type=search]{border:0;border-radius:0;background:transparent;flex:1;min-height:44px;padding:0;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0;width:auto}

/* sheets and forms */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 0;overscroll-behavior:contain}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{border-radius:14px;padding:22px 24px 0}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;overflow-wrap:anywhere}
.sheet-head .sub{font-size:14px;color:var(--muted);margin-top:6px;max-width:46ch}
.sheet-head.bare{position:absolute;top:14px;right:16px;margin:0;z-index:2}
.sheet-head.bare h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet-head.bare + .detail{padding-top:6px}
.sheet-head.bare + .detail .d-state{padding-right:48px;min-height:24px}
.sheet-body-pad{padding-bottom:22px}
.icon-btn{border:1px solid var(--hair);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--ink)}
.form{display:grid;gap:18px}
.field{display:grid;gap:7px;min-width:0}
.field > label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.opt{font-weight:400;color:var(--muted);margin-left:6px}
.hint{font-size:13px;color:var(--muted)}
.warnline{font-size:13px;color:var(--warm);font-weight:600}
.err{font-size:13.5px;color:var(--warm);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.sub-field{display:grid;gap:12px;padding:12px 0 2px 14px;border-left:2px solid var(--green-soft)}
input[type=text],input[type=search],select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input[type=text]:focus,select:focus{border-color:var(--green);outline:none}
input[type=range]{width:100%;accent-color:var(--green);min-height:28px}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--surface);justify-self:start}
.stepper button{width:44px;min-height:44px;border:0;background:var(--surface);font-size:20px;color:var(--ink);line-height:1}
.stepper button:hover{background:var(--fill)}
.stepper output{min-width:100px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;border-inline:1px solid var(--hair);padding-inline:8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;justify-self:start;max-width:100%}
.seg button{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.seg button:not([aria-pressed="true"]):not(:disabled):hover{border-color:var(--ink)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daychip{border:1px solid var(--hair);background:var(--surface);border-radius:10px;padding:7px 8px;font-size:13px;font-weight:600;line-height:1.1;text-align:center;min-width:54px}
.daychip small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
.daychip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.daychip[aria-pressed="true"] small{color:inherit}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);margin-top:4px}
.extras{margin-top:22px;padding-block:14px 20px;border-top:1px solid var(--hair);display:grid;gap:14px}
.extra-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.extra-row > div{flex:1 1 220px}
.sug{display:grid;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.sug-k{font-size:13px;font-weight:600;color:var(--green-text)}
.sug-v{font-size:20px;font-weight:600;line-height:1.3}
.plist{margin-bottom:10px}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.pl-n{font-weight:600}
.pl-m{font-size:13px;color:var(--muted);flex:1 1 180px}
.pl-w{font-size:12.5px;font-weight:600;color:var(--warm)}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
body.sheet-open .toast-wrap{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:520px}
.signin{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:max(48px,10vh) 16px 48px}
.signin-in{width:100%;max-width:400px;display:grid;gap:16px}
.signin .mark{font-size:56px}
.signin .mark .dot{width:14px;height:14px;margin-left:4px}
.lede{font-size:16px;color:var(--ink-2);max-width:36ch}
.signin-card{display:grid;gap:14px;padding:20px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow)}
.signin-card h1{font-size:21px;font-weight:700;line-height:1.25}
.signin-card .form{gap:14px}
.signin-alt{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.signin-foot{font-size:12.5px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--hair)}
.btn-block{width:100%}
.code-input{text-align:center;letter-spacing:.3em;font-size:22px !important;font-variant-numeric:tabular-nums}
input[type=email]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input[type=email]:focus{border-color:var(--green);outline:none}
.foot{margin-top:52px;font-size:12.5px;color:var(--muted);display:grid;gap:4px;max-width:62ch}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<noscript><p style="padding:24px;font-family:system-ui,sans-serif">In. needs JavaScript turned on.</p></noscript>
<div id="app"><p class="boot">Loading In.</p></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('app');
  if (!window.htmPreact) {
    root.innerHTML = '<p class="boot">In. could not load its interface. Check your connection and reload the page.</p>';
    return;
  }
  const { html, render, useState, useEffect, useMemo, useRef, useCallback } = window.htmPreact;

  /* ---------------- The trail: named access points, mile 0 at the south end (approximate) ---------------- */
  const SPOTS = [
    { id: 'grays-ferry', name: 'Grays Ferry Crescent', short: 'Grays Ferry', mi: 0 },
    { id: 'christian', name: 'Christian St', short: 'Christian St', mi: 1.0, gx: 26, gy: -0.99 },
    { id: 'south', name: 'South St Bridge', short: 'South St', mi: 1.35, gx: 26, gy: -0.63 },
    { id: 'locust', name: 'Locust St (Schuylkill River Park)', short: 'Locust St', mi: 1.7, gx: 25, gy: -0.27 },
    { id: 'walnut', name: 'Walnut St Bridge', short: 'Walnut St', mi: 1.85, gx: 25, gy: -0.18 },
    { id: 'chestnut', name: 'Chestnut St Bridge', short: 'Chestnut St', mi: 1.95, gx: 24.5, gy: -0.09 },
    { id: 'market', name: 'Market St', short: 'Market St', mi: 2.05, gx: 24.5, gy: 0 },
    { id: 'paines', name: "Paine's Park", short: "Paine's Park", mi: 2.8, gx: 25, gy: 0.6 },
    { id: 'art-museum', name: 'Art Museum / Water Works', short: 'Art Museum', mi: 3.0, gx: 25.5, gy: 0.75 },
    { id: 'boathouse', name: 'Boathouse Row', short: 'Boathouse Row', mi: 3.3 },
    { id: 'girard', name: 'Girard Ave Bridge', short: 'Girard Ave', mi: 3.9 },
    { id: 'strawberry', name: 'Strawberry Mansion Bridge', short: 'Strawberry Mansion', mi: 5.4 },
    { id: 'falls', name: 'Falls Bridge', short: 'Falls Bridge', mi: 6.9 },
    { id: 'manayunk', name: 'Manayunk (Lock St)', short: 'Manayunk', mi: 9.8 },
  ];
  const SPOT = {};
  SPOTS.forEach(s => { SPOT[s.id] = s; });
  const spotMi = id => (SPOT[id] ? SPOT[id].mi : 1.85);
  const spotName = id => (SPOT[id] ? SPOT[id].name : 'the trail');

  /* ---------------- The street grid: Center City and University City (approximate) ----------------
     A point is (numbered street, miles north of Market). One block between numbered streets is about 0.1 mi.
     Walking between two grid points counts city blocks; getting to the trail counts blocks to an access point. */
  const BLOCK_MI = 0.1;
  const CROSS = [
    { id: 'fairmount', name: 'Fairmount Ave', y: 0.75 }, { id: 'spring-garden', name: 'Spring Garden', y: 0.6 },
    { id: 'callowhill', name: 'Callowhill', y: 0.45 }, { id: 'vine', name: 'Vine', y: 0.34 }, { id: 'race', name: 'Race', y: 0.25 },
    { id: 'arch', name: 'Arch', y: 0.16 }, { id: 'jfk', name: 'JFK Blvd', y: 0.07 }, { id: 'market', name: 'Market', y: 0 },
    { id: 'chestnut', name: 'Chestnut', y: -0.09 }, { id: 'sansom', name: 'Sansom', y: -0.135 }, { id: 'walnut', name: 'Walnut', y: -0.18 },
    { id: 'locust', name: 'Locust', y: -0.27 }, { id: 'spruce', name: 'Spruce', y: -0.36 }, { id: 'pine', name: 'Pine', y: -0.45 },
    { id: 'lombard', name: 'Lombard', y: -0.54 }, { id: 'south', name: 'South', y: -0.63 }, { id: 'bainbridge', name: 'Bainbridge', y: -0.72 },
    { id: 'fitzwater', name: 'Fitzwater', y: -0.81 }, { id: 'catharine', name: 'Catharine', y: -0.9 }, { id: 'christian', name: 'Christian', y: -0.99 },
  ];
  const CROSS_BY = {};
  CROSS.forEach(c => { CROSS_BY[c.id] = c; });
  const STREETS = [];
  for (let n = 15; n <= 26; n++) STREETS.push(n);
  for (let n = 30; n <= 42; n++) STREETS.push(n);
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  // Places people meet or end up. Starts in the neighborhood, and food or coffee after.
  const PLACES = [
    { id: '2116-chestnut', name: '2116 Chestnut', where: '21st & Chestnut', gx: 21.2, gy: -0.09, kind: 'meet' },
    { id: 'rittenhouse', name: 'Rittenhouse Square', where: '19th & Walnut corner', gx: 19, gy: -0.18, kind: 'meet' },
    { id: 'fitler', name: 'Fitler Square', where: '23rd & Pine', gx: 23, gy: -0.45, kind: 'meet' },
    { id: 'huntsman', name: 'Huntsman Hall', where: '38th & Walnut', gx: 37.3, gy: -0.18, kind: 'meet' },
    { id: 'la-colombe', name: 'La Colombe', where: '19th & Sansom', gx: 19, gy: -0.135, kind: 'food' },
    { id: 'parc', name: 'Parc', where: '18th & Locust, on the square', gx: 18, gy: -0.27, kind: 'food' },
    { id: 'rival-bros', name: 'Rival Bros. Coffee', where: '24th & Lombard', gx: 24, gy: -0.54, kind: 'food' },
    { id: 'ants-pants', name: 'Ants Pants Cafe', where: '22nd & South', gx: 22.1, gy: -0.63, kind: 'food' },
  ];
  const PLACE = {};
  PLACES.forEach(p => { PLACE[p.id] = p; });
  const gridD = (a, b) => Math.abs(a.gx - b.gx) * BLOCK_MI + Math.abs(a.gy - b.gy);
  const GRID_SPOTS = SPOTS.filter(s => typeof s.gx === 'number');
  // The trail access closest to a grid point, and how far it is.
  function nearestAccess(pt) {
    let best = null;
    GRID_SPOTS.forEach(s => { const d = gridD(pt, s); if (!best || d < best.d) best = { s, d }; });
    return best;
  }
  // Stored fields for a named start or finish. The closest trail spot and off-trail miles ride along so
  // visibility, the host's confirm suggestion, and older runs all keep working.
  function startFields(placeId, spot) {
    const p = PLACE[placeId];
    if (!p) return { spot: spot, place: '', placeOff: 0, placeId: '' };
    const n = nearestAccess(p);
    return { spot: n.s.id, place: p.name, placeOff: Math.round(n.d * 10) / 10, placeId: p.id };
  }
  function finishFields(finishId) {
    const none = { finish: '', finishSpot: '', finishOff: 0, finishId: '' };
    if (!finishId) return none;
    if (finishId.indexOf('trail:') === 0) {
      const id = finishId.slice(6);
      return SPOT[id] ? { finish: spotName(id), finishSpot: id, finishOff: 0, finishId } : none;
    }
    const p = PLACE[finishId];
    if (!p) return none;
    const n = nearestAccess(p);
    return { finish: p.name, finishSpot: n.s.id, finishOff: Math.round(n.d * 10) / 10, finishId: p.id };
  }
  // Schematic scale for the strip: each gap between named spots gets a base width plus a bit per mile.
  const CUM = [];
  SPOTS.forEach((s, i) => CUM.push(i ? CUM[i - 1] + 29 + 10 * (s.mi - SPOTS[i - 1].mi) : 0));
  const CUM_MAX = CUM[CUM.length - 1];
  function norm(mi) {
    if (mi <= SPOTS[0].mi) return 0;
    for (let i = 1; i < SPOTS.length; i++) {
      if (mi <= SPOTS[i].mi) {
        const a = SPOTS[i - 1].mi, b = SPOTS[i].mi;
        return (CUM[i - 1] + ((mi - a) / (b - a)) * (CUM[i] - CUM[i - 1])) / CUM_MAX;
      }
    }
    return 1;
  }

  /* ---------------- Beta bots: Philly icons, always shown by full name with a Bot tag, who say they're in on real runs.
     They never host, never send friend requests, never show up in Friends, are never written to storage,
     and switch off by themselves once BOTS_UNTIL real people have runner cards. ---------------- */
  const BOTS_UNTIL = 20;
  const SAMPLES = [
    { id: 'sample-maya', handle: 'Ben Franklin', spot: 'walnut', pace: 525, am: true, pm: false },
    { id: 'sample-dev', handle: 'Jalen Hurts', spot: 'market', pace: 470, am: true, pm: true },
    { id: 'sample-priya', handle: 'Betsy Ross', spot: 'south', pace: 555, am: true, pm: false },
    { id: 'sample-tomas', handle: 'Rocky Balboa', spot: 'art-museum', pace: 435, am: true, pm: false },
    { id: 'sample-hannah', handle: 'Grace Kelly', spot: 'christian', pace: 500, am: false, pm: true },
    { id: 'sample-sam', handle: 'William Penn', spot: 'walnut', pace: 580, am: true, pm: true },
    { id: 'sample-ines', handle: 'Marian Anderson', spot: 'boathouse', pace: 485, am: true, pm: false },
    { id: 'sample-marcus', handle: 'Wilt Chamberlain', spot: 'paines', pace: 510, am: true, pm: true },
    { id: 'sample-aisha', handle: 'John Coltrane', spot: 'market', pace: 540, am: true, pm: false },
    { id: 'sample-leo', handle: 'Joe Frazier', spot: 'south', pace: 460, am: false, pm: true },
  ].map(s => Object.assign(s, { sample: true, vis: 'fof' }));
  const SAMPLE_EDGES = [
    ['sample-maya', 'sample-dev'], ['sample-maya', 'sample-priya'], ['sample-maya', 'sample-sam'], ['sample-maya', 'sample-aisha'],
    ['sample-dev', 'sample-tomas'], ['sample-dev', 'sample-leo'], ['sample-priya', 'sample-hannah'], ['sample-tomas', 'sample-ines'],
    ['sample-tomas', 'sample-leo'], ['sample-hannah', 'sample-marcus'], ['sample-ines', 'sample-marcus'],
  ];
  const isSample = id => typeof id === 'string' && id.indexOf('sample-') === 0;
  const pairId = (a, b) => (a < b ? a + '__' + b : b + '__' + a);

  /* ---------------- Formatting ---------------- */
  const pad2 = n => String(n).padStart(2, '0');
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dateKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const parseKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const atMin = (k, min) => { const d = parseKey(k); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, min); };
  const lockByFor = k => { const d = parseKey(k); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1, 22, 0); };
  function clockParts(min) {
    const m = ((Math.round(min) % 1440) + 1440) % 1440;
    let h = Math.floor(m / 60);
    const pm = h >= 12;
    h = h % 12 || 12;
    return { hm: h + ':' + pad2(m % 60), ap: pm ? 'PM' : 'AM' };
  }
  const clock = min => { const c = clockParts(min); return c.hm + ' ' + c.ap; };
  const pace = s => { s = Math.round(s); return Math.floor(s / 60) + ':' + pad2(s % 60); };
  const mi1 = x => (Math.round(Number((x * 10).toFixed(6))) / 10).toFixed(1);
  const distTxt = d => (d % 1 ? d.toFixed(1) : String(d));
  function dur(ms) { const m = Math.max(0, Math.ceil(ms / 60000)); const h = Math.floor(m / 60); return h ? h + 'h ' + pad2(m % 60) + 'm' : m + 'm'; }
  const dayDiff = (k, todayK) => Math.round((parseKey(k) - parseKey(todayK)) / 864e5);
  function dayName(k, todayK) { const n = dayDiff(k, todayK); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : DOW_LONG[parseKey(k).getDay()]; }
  function dayRef(k, todayK) { const n = dayDiff(k, todayK); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : DOW_LONG[parseKey(k).getDay()]; }
  const dateTxt = k => { const d = parseKey(k); return DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); };
  const autoTitle = min => (min < 660 ? 'Morning run' : min < 840 ? 'Midday run' : min < 1020 ? 'Afternoon run' : 'Evening run');
  const shortPlace = s => String(s || '').split(',')[0].trim();
  const startLabel = r => r.place || spotName(r.spot);
  const startShort = r => (r.place ? shortPlace(r.place) : spotName(r.spot));
  function initials(name) {
    const w = String(name || '?').replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
    if (!w.length) return '?';
    return (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();
  }
  function shortName(n) { const w = String(n || '').trim().split(/\s+/).filter(Boolean); return w.length > 1 ? w[0] + ' ' + w[w.length - 1][0] + '.' : w[0] || ''; }
  const lsGet = k => { try { return window.localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch (e) {} };
  const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const isWide = () => !!(window.matchMedia && window.matchMedia('(min-width: 960px)').matches);

  /* ---------------- Distance: city blocks on the grid, trail miles along the river ----------------
     A location is a grid point { gx, gy } (your corner, 2116 Chestnut, a café), a trail spot { spot },
     or a typed-in place just off the trail { spot, off }. The shortest way between two locations is either
     straight through the streets (both on the grid) or streets to the trail, along it, and back off. */
  const offOf = (name, off) => (name ? (typeof off === 'number' ? off : 0.2) : 0);
  const onGrid = loc => typeof loc.gx === 'number';
  function toTrail(loc, s) {
    if (loc.spot) return loc.spot === s.id ? loc.off || 0 : Infinity;
    return onGrid(loc) && typeof s.gx === 'number' ? gridD(loc, s) : Infinity;
  }
  function route(a, b) {
    let best = onGrid(a) && onGrid(b) ? { mi: gridD(a, b), via: null } : null;
    SPOTS.forEach(s1 => {
      const c1 = toTrail(a, s1);
      if (!isFinite(c1)) return;
      SPOTS.forEach(s2 => {
        const c2 = toTrail(b, s2);
        if (!isFinite(c2)) return;
        const mi = c1 + Math.abs(s1.mi - s2.mi) + c2;
        if (!best || mi < best.mi - 1e-9) best = { mi, via: [s1, s2], c1, c2 };
      });
    });
    return best;
  }
  function legsOf(a, b, rt) {
    if (!rt) return [];
    if (!rt.via) return rt.mi >= 0.05 ? [{ from: a.name, to: b.name, mi: rt.mi }] : [];
    const s1 = rt.via[0], s2 = rt.via[1], out = [];
    if (rt.c1 >= 0.05) out.push({ from: a.name, to: s1.name, mi: rt.c1 });
    if (Math.abs(s1.mi - s2.mi) >= 0.05) out.push({ label: 'Along the trail to ' + s2.name, mi: Math.abs(s1.mi - s2.mi) });
    if (rt.c2 >= 0.05) out.push({ from: s2.name, to: b.name, mi: rt.c2 });

  }
  const trailFinish = r => (typeof r.finishId === 'string' && r.finishId.indexOf('trail:') === 0 && SPOT[r.finishId.slice(6)] ? r.finishId.slice(6) : '');
  function startLoc(r) {
    const p = PLACE[r.placeId];
    if (p) return { name: p.name, gx: p.gx, gy: p.gy };
    if (r.place) return { name: shortPlace(r.place), spot: r.spot, off: r.placeOff };
    return { name: spotName(r.spot), spot: r.spot, off: 0 };
  }
  function finishLoc(r) {
    if (!r.finish) return startLoc(r);
    const p = PLACE[r.finishId];
    if (p) return { name: p.name, gx: p.gx, gy: p.gy };
    const ts = trailFinish(r);
    if (ts) return { name: spotName(ts), spot: ts, off: 0 };
    return { name: shortPlace(r.finish), spot: r.finishSpot || r.spot, off: r.finishOff || 0 };
  }
  // Home: your nearest corner if you set one (private), otherwise your trail spot plus door-to-trail miles.
  function homeLoc(meP, home) {
    if (home && typeof home.st === 'number' && CROSS_BY[home.cross]) return { name: 'Your door', gx: home.st, gy: CROSS_BY[home.cross].y, corner: true };
    const hasDoor = !!(home && typeof home.dist === 'number');
    return { name: 'Your door', spot: meP.spot, off: hasDoor ? home.dist : 0, hasDoor };
  }
  // Labeled legs for one runner: door to the start, the run, and the way home from wherever it ends.
  // Leave time: jog at easy pace + 1:00/mi (or walk at 18:00/mi), arrive 3 minutes early, rounded down to 5 minutes
  // because the distances are approximate.
  const WALK_PACE = 1200;  // seconds per mile: a 20:00/mi walk
  function myLegs(r, meP, home) {
    if (!meP || !SPOT[meP.spot]) return null;
    const H = homeLoc(meP, home), Hb = Object.assign({}, H, { name: 'your door' });
    const S = startLoc(r), Fn = finishLoc(r);
    const go = route(H, S), back = route(Fn, Hb);
    const there = legsOf(H, S, go), backL = legsOf(Fn, Hb, back);
    const toStart = go ? go.mi : 0, homeLeg = back ? back.mi : 0;
    const runRow = { label: r.finish ? S.name + ' → ' + Fn.name : S.name + ', out and back', mi: r.dist };
    // Getting to and from runs: walking at 20:00/mi unless you've said you jog (easy pace + 1:00/mi).
    const mode = meP.travel === 'jog' ? 'jog' : 'walk';
    const speed = mode === 'walk' ? WALK_PACE : (meP.pace || 540) + 60;
    const travelMin = (toStart * speed) / 60;
    const runMin = (r.dist * r.pace) / 60;
    const homeMin = (homeLeg * speed) / 60;
    return {
      hasDoor: !!(H.corner || H.hasDoor), corner: !!H.corner, there, back: backL, runRow, run: r.dist, toStart, homeLeg, total: toStart + r.dist + homeLeg,
      mode, speed, travelMin, runMin, homeMin,
      leaveAt: Math.floor((r.start - travelMin - 3) / 5) * 5,
      homeAt: Math.ceil((r.start + runMin + homeMin) / 5) * 5,
    };
  }

  /* ---------------- Nash bargaining for the lock ----------------
     Each runner's gain from running together = company bonus - distance cost - pace cost.
     Distance is counted from each runner's trail spot to the meeting place (door-to-trail miles are
     private and the same wherever you meet). Running faster than you like costs more than running
     slower, and the host gets a small bonus for the place they posted. The suggestion maximizes the
     product of gains, which spreads the compromise instead of piling it on one person. */
  const NASH = { B: 30, detour: 6, faster: 0.5, slower: 0.2, hostPref: 4 };
  const paceCost = (pref, q) => (q < pref ? NASH.faster * (pref - q) : NASH.slower * (q - pref));
  const reach = (p, c) => Math.abs(p.mi - c.mi) + c.off;
  const gainsAt = (parts, c, q, baseKey) => parts.map(p => NASH.B - NASH.detour * reach(p, c) - paceCost(p.pace, q) + (p.host && c.key === baseKey ? NASH.hostPref : 0));
  function lockCands(r) {
    const baseMi = spotMi(r.spot);
    // A start in the neighborhood (2116 Chestnut, Rittenhouse Square) is a deliberate meeting point, not a
    // trail compromise, so confirming keeps it and only settles the pace.
    if (PLACE[r.placeId]) return [{ key: 'place', mi: baseMi, off: offOf(r.place, r.placeOff) }];
    const cands = SPOTS.filter(s => Math.abs(s.mi - baseMi) <= 1.6).map(s => ({ key: s.id, mi: s.mi, off: 0 }));
    if (r.place) cands.unshift({ key: 'place', mi: baseMi, off: offOf(r.place, r.placeOff) });
    return cands;
  }
  function nashSuggest(parts, r) {
    if (!parts.length) return null;
    const baseKey = r.place ? 'place' : r.spot;
    const cands = lockCands(r);
    const base = cands.find(c => c.key === baseKey) || cands[0];
    if (parts.length === 1) return { key: base.key, cand: base, pace: r.pace, gains: gainsAt(parts, base, r.pace, baseKey), ok: true };
    const ps = parts.map(p => p.pace);
    const lo = Math.floor((Math.min.apply(null, ps) - 15) / 5) * 5;
    const hi = Math.ceil((Math.max.apply(null, ps) + 30) / 5) * 5;
    let best = null;
    cands.forEach(c => {
      for (let q = lo; q <= hi; q += 5) {
        const g = gainsAt(parts, c, q, baseKey);
        const ok = g.every(x => x > 0);
        let score = g.reduce((a, x) => a + Math.log(Math.max(x, 0.25)), 0) - (ok ? 0 : 100);
        score -= 1e-4 * (Math.abs(c.mi - base.mi) + Math.abs(q - r.pace) / 60 + (c.key === baseKey ? 0 : 0.05));
        if (!best || score > best.score) best = { key: c.key, cand: c, pace: q, gains: g, ok, score };
      }
    });
    return best;
  }
  function participantsOf(r, profiles) {
    const hp = profiles[r.host];
    const out = [{ id: r.host, mi: spotMi(hp && hp.spot ? hp.spot : r.spot), pace: r.pace, host: true }];
    r.joiners.forEach(j => { const p = profiles[j.id]; if (p && p.spot) out.push({ id: j.id, mi: spotMi(p.spot), pace: p.pace || r.pace }); });
    return out;
  }
  const lockedPlace = (r, key) => (key === 'place' ? { spot: r.spot, place: r.place, placeOff: offOf(r.place, r.placeOff), placeId: r.placeId || '' } : { spot: key, place: '', placeOff: 0, placeId: '' });
  // Would a sample classmate plausibly say they'd be in?
  function sampleFits(s, r) {
    const am = r.start < 720;
    if (am ? !s.am : !s.pm) return false;
    const flex = r.status === 'intention' ? 20 : 0;
    if (Math.abs(s.pace - r.pace) > 35 + flex) return false;
    if (Math.abs(spotMi(s.spot) - spotMi(r.spot)) > 2.5) return false;
    return true;
  }

  /* ---------------- Storage: the live shared board, or a local sandbox ---------------- */
  const Store = {
    mode: 'loading', me: null, pseudo: false, canWrite: false, isOwner: false, suggestedHandle: '', sandboxReason: '', cloud: false, email: '', authError: '',
    profiles: {}, friendships: {}, runs: {}, joins: {}, config: {}, home: null, people: {}, thread: null,
    loaded: { profiles: false, friendships: false, runs: false, joins: false, home: false },
    api: null, subs: new Set(),
    on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
    emit() { this.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); },
    ready() {

  };

  const Sandbox = {
    KEY: 'in-wharton-sandbox-v1',

      if (!s || typeof s !== 'object') s = {};

        mode: 'sandbox', api: Sandbox, me: 'me-local', pseudo: false, canWrite: true, isOwner: true, sandboxReason: reason || Store.sandboxReason || '',

    save() {

    },
    put(coll, id, doc) { const o = Object.assign({}, Store[coll]); o[id] = doc; Store[coll] = o; this.save(); Store.emit(); },
    patch(coll, id, p) {

    async setConfig(c) { Store.config = c; this.save(); Store.emit(); },
    newRunId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },

  function pseudoId() {
    let id = lsGet('in-guest-id');
    if (!id || !/^g-[a-z0-9]+$/.test(id)) { id = 'g-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); lsSet('in-guest-id', id); }

  const Live = {
    db: null, user: null, unsubs: [],

        suggestedHandle: meInfo && meInfo.name ? shortName(meInfo.name) : '',

      const since = dateKey(addDays(new Date(), -1));
      const toMap = snap => { const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); return o; };

      sub(db.collection('profiles'), 'profiles');
      sub(db.collection('friendships'), 'friendships');
      sub(db.collection('runs').where('date', '>=', since), 'runs');
      sub(db.collection('joins').where('date', '>=', since), 'joins');
      this.unsubs.push(db.doc('config/app').onSnapshot(guard(s => { Store.config = s.exists ? Object.assign({}, s.data()) : {}; Store.emit(); }), onErr('config')));
      if (pseudo) {

    },
    stop() { this.unsubs.forEach(u => { try { u(); } catch (e) {} }); this.unsubs = []; },
    saveProfile(p) { return this.db.doc('profiles/' + Store.me).set(p); },
    async saveHome(h) {
      if (Store.pseudo) { lsSet('in-home-' + Store.me, JSON.stringify(h)); Store.home = h; Store.emit(); return; }

    },
    setFriendship(id, d) { return this.db.doc('friendships/' + id).set(d); },

    deleteFriendship(id) { return this.db.doc('friendships/' + id).delete(); },
    setRun(id, d) { return this.db.doc('runs/' + id).set(d); },
    updateRun(id, p) { return this.db.doc('runs/' + id).update(p); },
    setJoin(id, d) { return this.db.doc('joins/' + id).set(d); },
    deleteJoin(id) { return this.db.doc('joins/' + id).delete(); },

  /* ---------------- Cloud: the public app, backed by Supabase (config.js) ----------------
     Same interface as Live and Sandbox, so every screen works unchanged. Real people's data goes to the
     database, where row-level security decides who sees what. Anything involving the sample classmates
     (friending one, joining a sample run) stays on this device and never touches the database. */
  const iso = ms => new Date(ms || Date.now()).toISOString();
  const msOf = t => (t ? Date.parse(t) || 0 : 0);
  const RUN_COLS = { host: 'host', date: 'date', status: 'status', start: 'start', title: 'title', spot: 'spot', place: 'place', placeOff: 'place_off', placeId: 'place_id', finish: 'finish', finishSpot: 'finish_spot', finishOff: 'finish_off', finishId: 'finish_id', pace: 'pace', dist: 'dist', vis: 'vis', note: 'note', samplesIn: 'samples_in' };
  function runToRow(d) {
    const row = {};
    Object.keys(RUN_COLS).forEach(k => { if (d[k] !== undefined) row[RUN_COLS[k]] = d[k]; });
    if (d.lockedAt !== undefined) row.locked_at = d.lockedAt ? iso(d.lockedAt) : null;
    if (d.createdAt) row.created_at = iso(d.createdAt);
    return row;
  }
  function runFromRow(r) {
    return {
      host: r.host, date: r.date, status: r.status, start: r.start, title: r.title || '', spot: r.spot,
      place: r.place || '', placeOff: Number(r.place_off) || 0, placeId: r.place_id || '',
      finish: r.finish || '', finishSpot: r.finish_spot || '', finishOff: Number(r.finish_off) || 0, finishId: r.finish_id || '',
      pace: r.pace, dist: Number(r.dist), vis: r.vis, note: r.note || '', samplesIn: r.samples_in || [],
      createdAt: msOf(r.created_at), lockedAt: msOf(r.locked_at), leftBy: r.left_by || '', leftAt: msOf(r.left_at),

  }
  function prettyHandle(user) {
    const m = (user && user.user_metadata) || {};
    const full = m.full_name || m.name || '';
    if (full) return String(full).trim().replace(/\s+/g, ' ').slice(0, 40);
    const local = String((user && user.email) || '').split('@')[0].replace(/[0-9]+/g, ' ');
    const w = local.split(/[._\-+\s]+/).filter(Boolean);
    if (!w.length) return '';
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
    return w.map(cap).join(' ').slice(0, 40);

  function cloudError(e) {

    if (/^(22|23)/.test(code)) return { code: 'invalid', message: msg };
    if (/^PGRST30|JWT|token/i.test(code + ' ' + msg)) return { code: 'auth', message: msg };
    return { code: 'unavailable', message: msg };

  const Cloud = {
    sb: null, cfg: null, uid: null, chan: null, poll: null, timers: {}, local: null, rows: { friendships: {}, joins: {} },
    // What's wrong with config.js, if anything: 'config' (not filled in), 'url', 'secret' (the private key), 'lib' (supabase-js didn't load).
    problem() {
      const c = window.IN_CONFIG || {};
      const url = String(c.supabaseUrl || '').trim(), key = String(c.supabaseAnonKey || '').trim();
      if (!url || !key || /YOUR[-_]/.test(url + key)) return 'config';
      if (!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)/.test(url)) return 'url';
      let role = '';
      try { const part = key.split('.')[1] || ''; role = JSON.parse(atob(part.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((part.length + 3) % 4))).role || ''; } catch (e) { role = ''; }
      if (/^sb_secret_/.test(key) || role === 'service_role') return 'secret';

    },
    start() {
      this.cfg = window.IN_CONFIG;

      Object.assign(Store, { mode: 'loading', cloud: true, api: Cloud });
      const hash = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
      if (hash.get('error_description')) Store.authError = hash.get('error_description').replace(/\+/g, ' ');
      // Supabase warns against awaiting its own calls inside this callback, so hand off to the next tick.
      this.sb.auth.onAuthStateChange((event, session) => { setTimeout(() => this.onSession(session), 0); });
      Store.emit();
    },
    async onSession(session) {
      if (!session || !session.user) {
        if (Store.mode !== 'signin') { this.stop(); Object.assign(Store, { mode: 'signin', me: null, email: '', profiles: {}, friendships: {}, runs: {}, joins: {}, home: null, config: {}, loaded: { profiles: false, friendships: false, runs: false, joins: false, home: false } }); Store.emit(); }
        return;
      }
      const uid = session.user.id;
      if (this.uid === uid && Store.mode === 'live') return;
      this.stop();
      this.uid = uid;
      try { this.local = JSON.parse(lsGet('in-local-' + uid) || 'null') || { friendships: {}, joins: {} }; } catch (e) { this.local = { friendships: {}, joins: {} }; }
      if (String(location.hash).indexOf('access_token') !== -1 || /[?&]code=/.test(location.search)) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
      Object.assign(Store, { mode: 'live', api: Cloud, me: uid, pseudo: false, canWrite: true, isOwner: false, email: session.user.email || '', suggestedHandle: prettyHandle(session.user), authError: '' });
      await this.loadAll();
      this.sb.rpc('is_admin').then(({ data }) => { Store.isOwner = !!data; Store.emit(); });
      this.chan = this.sb.channel('in-board');

      // so a run change means its people may have changed too.
      [['profiles', ['profiles']], ['friendships', ['friendships']], ['runs', ['runs', 'joins']], ['app_config', ['config']]].forEach(t => {
        this.chan.on('postgres_changes', { event: '*', schema: 'public', table: t[0] }, () => t[1].forEach(w => this.soon(w)));
      });
      this.chan.on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => {
        if (!this.thread) return;
        clearTimeout(this.timers.thread);
        this.timers.thread = setTimeout(() => this.loadThread(), 250);
      });

    },
    stop() {
      this.closeThread();

      if (this.poll) { clearInterval(this.poll); this.poll = null; }
      if (this.onVis) { document.removeEventListener('visibilitychange', this.onVis); this.onVis = null; }
