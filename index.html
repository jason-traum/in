  function ProfileSheet({ M, onboarding, onClose, act }) {
    const cur = M.meP;
    const h = M.home || {};
    const hasCorner = typeof h.st === 'number' && !!CROSS_BY[h.cross];
    const [f, setF] = useState(() => {
      const st = hasCorner ? h.st : 20, cross = hasCorner ? h.cross : 'walnut';
      return {
        handle: (cur && cur.handle) || Store.suggestedHandle || '',
        where: hasCorner || typeof h.dist !== 'number' ? 'corner' : 'trail',
        st, cross,
        spot: (cur && cur.spot) || nearestAccess({ gx: st, gy: CROSS_BY[cross].y }).s.id,
        spotSet: !!cur,
        dist: typeof h.dist === 'number' ? h.dist : 0.3,
        pace: (cur && cur.pace) || 540,
        travel: (cur && cur.travel) || 'walk',
      };
    });
    const [err, setErr] = useState('');
    const [busy, setBusy] = useState(false);
    const set = (k, v) => setF(o => Object.assign({}, o, { [k]: v }));
    // Until you pick a trail spot yourself, it follows your corner to the closest access.
    const setCorner = (k, v) => setF(o => {
      const n = Object.assign({}, o, { [k]: v });
      if (!o.spotSet) n.spot = nearestAccess({ gx: n.st, gy: CROSS_BY[n.cross].y }).s.id;
      return n;
    });
    const submit = async e => {
      e.preventDefault();
      const handle = f.handle.trim();
      if (!handle) { setErr('Add your first and last name.'); return; }
      if (handle.split(/\s+/).length < 2) { setErr('Add your last name too, so people know who’s coming.'); return; }
      setBusy(true);
      const home = f.where === 'corner' ? { st: f.st, cross: f.cross } : { dist: Math.round(f.dist * 10) / 10 };
      const ok = await act.saveProfile({ handle: handle.replace(/\s+/g, ' ').slice(0, 40), spot: f.spot, pace: f.pace, travel: f.travel, vis: (cur && cur.vis) || 'fof', updatedAt: Date.now() }, home);
      setBusy(false);
      if (ok) onClose();
    };
    const toGrid = f.where === 'corner' && SPOT[f.spot] && typeof SPOT[f.spot].gx === 'number' ? gridD({ gx: f.st, gy: CROSS_BY[f.cross].y }, SPOT[f.spot]) : null;
    return html`<${Sheet} title=${onboarding ? 'Set up your runner card' : 'Your runner card'} sub=${onboarding ? 'Roughly where you live, where you meet the river, and your easy pace.' : null} onClose=${onClose}>
      <form class="form" onSubmit=${submit}>
        <div class="field"><label for="pf-name">Your name</label><input id="pf-name" type="text" maxlength="40" autocomplete="name" placeholder="First and last name" value=${f.handle} onInput=${e => { set('handle', e.target.value); setErr(''); }} /></div>
        ${f.where === 'corner' ? html`<div class="field"><label for="pf-st">Your nearest corner</label>
          <div class="corner">
            <select id="pf-st" aria-label="Numbered street" value=${f.st} onChange=${e => setCorner('st', Number(e.target.value))}>${STREETS.map(n => html`<option key=${n} value=${n}>${ordinal(n)}</option>`)}</select>
            <span aria-hidden="true">&</span>
            <select id="pf-cross" aria-label="Cross street" value=${f.cross} onChange=${e => setCorner('cross', e.target.value)}>${CROSS.map(c => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>
          </div>
          <span class="hint">Only you see this. It sets your miles to each start, whether that's 2116 Chestnut or the trail. In. never asks for your address. <button type="button" class="linkish" onClick=${() => set('where', 'trail')}>I don't live in Center City or University City</button></span></div>`
        : html`<div class="field"><label for="pf-dist">Door to trail: ${f.dist.toFixed(1)} mi</label>
          <input id="pf-dist" type="range" min="0.1" max="1" step="0.1" value=${f.dist} onInput=${e => set('dist', Number(e.target.value))} />
          <span class="hint">How far you go from your door to your trail spot. Only you see it. <button type="button" class="linkish" onClick=${() => set('where', 'corner')}>Use my nearest corner instead</button></span></div>`}
        <div class="field"><label for="pf-spot">Where you meet the trail</label>
          <select id="pf-spot" value=${f.spot} onChange=${e => setF(o => Object.assign({}, o, { spot: e.target.value, spotSet: true }))}>${SPOTS.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select>
          <span class="hint">Friends see this spot.${toGrid != null ? ' About ' + mi1(toGrid) + ' mi from your corner.' : ''}</span></div>
        <div class="field"><span class="lbl">Easy pace</span><${Stepper} id="pf-pace" label="pace" value=${f.pace} min=${300} max=${780} step=${5} fmt=${v => pace(v) + ' /mi'} onChange=${v => set('pace', v)} /></div>
        <div class="field"><span class="lbl">Getting to and from runs</span><${Seg} label="Getting to and from runs" value=${f.travel} onChange=${v => set('travel', v)} options=${[['walk', 'Walk'], ['jog', 'Jog']]} />
          <span class="hint">${f.travel === 'jog' ? 'Leave and home times assume you jog at your easy pace plus 1:00/mi, so ' + pace(f.pace + 60) + '/mi.' : 'Leave and home times assume you walk to and from runs at 20:00/mi.'}</span></div>
        ${err ? html`<p class="err">${err}</p>` : null}
        <div class="sheet-actions">
          <button type="button" class="btn btn-text" onClick=${onClose}>${onboarding ? 'Just browse' : 'Close'}</button>
          ${M.canWrite ? html`<button type="submit" class="btn btn-go btn-lg" disabled=${busy}>${onboarding ? 'Save and start' : 'Save'}</button>` : null}
        </div>
      </form>
      <${ProfileExtras} M=${M} act=${act} />
    <//>`;
  }

  const TIME_OPTS = [];
  for (let t = 300; t <= 1260; t += 15) TIME_OPTS.push(t);

  function PostSheet({ M, now, opts, onClose, act }) {
    const o = opts || {};
    const editing = o.edit || null;
    const base = editing || o.from || null;
    const [f, setF] = useState(() => {
      const tmr = dateKey(addDays(now, 1));
      let date = o.date || (base ? base.date : tmr);
      if (date < M.todayK) date = tmr;
      const kind = o.kind || (editing ? (editing.status === 'locked' ? 'locked' : 'intention') : now < lockByFor(date) ? 'intention' : 'locked');
      const mySpot = M.meP ? M.meP.spot : 'walnut';
      return {
        kind, date,
        title: base && !base.titleAuto ? base.title || '' : '',
        start: base ? base.start : 390,
        placeId: base && PLACE[base.placeId] ? base.placeId : '',
        custom: !!(base && base.place && !PLACE[base.placeId]), place: base && base.place && !PLACE[base.placeId] ? base.place : '', spot: base ? base.spot : mySpot,
        placeOff: base && base.place && !PLACE[base.placeId] ? offOf(base.place, base.placeOff) : 0.2,
        finishMode: base && base.finish ? 'else' : 'back',
        finishPick: !(base && base.finish) ? '' : PLACE[base.finishId] ? 'p:' + base.finishId : trailFinish(base) ? 't:' + trailFinish(base) : '__custom',
        finish: base && base.finish && !PLACE[base.finishId] && !trailFinish(base) ? base.finish : '', finishSpot: base ? base.finishSpot || base.spot : mySpot,
        finishOff: base && base.finish ? offOf(base.finish, base.finishOff) : 0.2,
        pace: base ? base.pace : M.meP ? M.meP.pace : 540,
        dist: base ? base.dist : 5,
        vis: base ? base.vis || 'fof' : (M.meP && M.meP.vis) || 'fof',
        note: base && base.note ? base.note : '',
      };
    });
    const [busy, setBusy] = useState(false);
    const [tried, setTried] = useState(false);
    const set = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
    const intentionOpen = now < lockByFor(f.date);
    const startAt = atMin(f.date, f.start);
    const problems = [];
    if (f.kind === 'intention' && !intentionOpen) problems.push('Proposals for ' + dayRef(f.date, M.todayK) + ' closed at 10 PM the night before. Post it confirmed.');
    if (startAt - now < 10 * 60000) problems.push('Pick a start at least 10 minutes from now.');
    if (tried && f.custom && !f.place.trim()) problems.push('Name the start, like a coffee shop or Huntsman Hall.');
    const elsewhere = f.finishMode === 'else';
    if (tried && elsewhere && !f.finishPick) problems.push('Pick where the run ends, or make it out and back.');
    if (tried && elsewhere && f.finishPick === '__custom' && !f.finish.trim()) problems.push('Name the finish, or make it out and back.');
    const lonely = M.me && M.F(M.me).size === 0 && f.vis !== 'wharton';
    const days = [];
    for (let i = 0; i < 7; i++) days.push(dateKey(addDays(now, i)));
    const timeOpts = TIME_OPTS.indexOf(f.start) === -1 ? TIME_OPTS.concat([f.start]).sort((a, b) => a - b) : TIME_OPTS;
    const pickDay = k => setF(p => Object.assign({}, p, { date: k, kind: p.kind === 'intention' && now >= lockByFor(k) ? 'locked' : p.kind }));
    const isInt = f.kind === 'intention';
    const submit = async e => {
      e.preventDefault();
      setTried(true);
      const missing = (f.custom && !f.place.trim()) || (elsewhere && (!f.finishPick || (f.finishPick === '__custom' && !f.finish.trim())));
      if (problems.length || missing || busy) return;
      const where = f.custom ? { spot: f.spot, place: f.place.trim().slice(0, 60), placeOff: f.placeOff, placeId: '' } : startFields(f.placeId, f.spot);
      let fin = finishFields('');
      if (elsewhere && f.finishPick === '__custom') fin = { finish: f.finish.trim().slice(0, 60), finishSpot: f.finishSpot, finishOff: f.finishOff, finishId: '' };
      else if (elsewhere && f.finishPick.indexOf('p:') === 0) fin = finishFields(f.finishPick.slice(2));
      else if (elsewhere && f.finishPick.indexOf('t:') === 0) fin = finishFields('trail:' + f.finishPick.slice(2));
      const doc = Object.assign({
        date: f.date, status: f.kind, start: f.start, title: (f.title.trim() || autoTitle(f.start)).slice(0, 48),
        pace: f.pace, dist: f.dist, vis: f.vis, note: f.note.trim().slice(0, 90),
      }, where, fin);
      setBusy(true);
      const ok = editing ? await act.editRun(editing, doc) : await act.createRun(doc);
      setBusy(false);
      if (ok) onClose();
    };
    return html`<${Sheet} title=${editing ? 'Edit run' : 'Post a run'} onClose=${onClose}>
      <form class="form" onSubmit=${submit}>
        <div class="field"><label for="ps-title">What's the run?<span class="opt">optional</span></label>
          <input id="ps-title" type="text" maxlength="48" placeholder=${autoTitle(f.start)} value=${f.title} onInput=${e => set('title', e.target.value)} /></div>
        <div class="field"><span class="lbl">Proposed or confirmed</span>
          <${Seg} label="Proposed or confirmed" value=${f.kind} onChange=${v => set('kind', v)} options=${[['intention', 'Proposed', !intentionOpen], ['locked', 'Confirmed']]} />
          <span class="hint">${isInt ? 'A rough plan. People tap I’d be in. You confirm the exact time and start by 10 PM the night before, or the run is dropped.' : intentionOpen ? 'Exact time and start. People tap I’m in.' : 'Proposals for ' + dayRef(f.date, M.todayK) + ' closed at 10 PM, so this goes up confirmed.'}</span></div>
        <div class="field"><span class="lbl">Day</span>
          <div class="daypick" role="group" aria-label="Day">${days.map((k, i) => { const d = parseKey(k); return html`<button type="button" key=${k} class="daychip" aria-pressed=${f.date === k} onClick=${() => pickDay(k)}>${i === 0 ? 'Today' : i === 1 ? 'Tmrw' : DOW[d.getDay()]}<small>${MON[d.getMonth()]} ${d.getDate()}</small></button>`; })}</div></div>
        <div class="field"><label for="ps-time">${isInt ? 'Around' : 'Start time'}</label>
          <select id="ps-time" value=${f.start} onChange=${e => set('start', Number(e.target.value))}>${timeOpts.map(t => html`<option key=${t} value=${t} disabled=${atMin(f.date, t) - now < 10 * 60000}>${clock(t)}</option>`)}</select></div>
        <div class="field"><label for="ps-spot">Start</label>
          <select id="ps-spot" value=${f.custom ? '__custom' : f.placeId ? 'p:' + f.placeId : f.spot} onChange=${e => {
            const v = e.target.value;
            if (v === '__custom') setF(p => Object.assign({}, p, { custom: true, placeId: '' }));
            else if (v.indexOf('p:') === 0) setF(p => Object.assign({}, p, { custom: false, placeId: v.slice(2) }));
            else setF(p => Object.assign({}, p, { custom: false, placeId: '', spot: v }));
          }}>
            <optgroup label="On the trail">${SPOTS.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</optgroup>
            <optgroup label="In the neighborhood">${PLACES.filter(pl => pl.kind === 'meet').map(pl => html`<option key=${pl.id} value=${'p:' + pl.id}>${pl.name} (${pl.where})</option>`)}</optgroup>
            <optgroup label="Coffee and food">${PLACES.filter(pl => pl.kind === 'food').map(pl => html`<option key=${pl.id} value=${'p:' + pl.id}>${pl.name} (${pl.where})</option>`)}</optgroup>
            <option value="__custom">Somewhere else…</option>
          </select>
          ${f.custom ? html`<div class="sub-field">
            <div class="field"><label for="ps-place">Place</label><input id="ps-place" type="text" maxlength="60" placeholder="Huntsman Hall steps" value=${f.place} onInput=${e => set('place', e.target.value)} /></div>
            <div class="field"><label for="ps-place-spot">Closest trail spot</label><select id="ps-place-spot" value=${f.spot} onChange=${e => set('spot', e.target.value)}>${SPOTS.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select></div>
            <div class="field"><span class="lbl">Distance from the trail</span><${Stepper} id="ps-place-off" label="distance from the trail" value=${f.placeOff} min=${0} max=${1.5} step=${0.1} fmt=${v => mi1(v) + ' mi'} onChange=${v => set('placeOff', v)} /><span class="hint">Added to everyone's miles to the start.</span></div>
          </div>` : null}</div>
        <div class="field"><span class="lbl">Finish</span>
          <${Seg} label="Finish" value=${f.finishMode} onChange=${v => set('finishMode', v)} options=${[['back', 'Out and back'], ['else', 'Ends somewhere else']]} />
          ${elsewhere ? html`<div class="sub-field">
            <div class="field"><label for="ps-finish-pick">Where it ends</label>
              <select id="ps-finish-pick" value=${f.finishPick} onChange=${e => set('finishPick', e.target.value)}>
                <option value="" disabled>Pick a place</option>
                <optgroup label="Coffee and food">${PLACES.filter(pl => pl.kind === 'food').map(pl => html`<option key=${pl.id} value=${'p:' + pl.id}>${pl.name} (${pl.where})</option>`)}</optgroup>
                <optgroup label="In the neighborhood">${PLACES.filter(pl => pl.kind === 'meet').map(pl => html`<option key=${pl.id} value=${'p:' + pl.id}>${pl.name} (${pl.where})</option>`)}</optgroup>
                <optgroup label="On the trail">${SPOTS.map(sp => html`<option key=${sp.id} value=${'t:' + sp.id}>${sp.name}</option>`)}</optgroup>
                <option value="__custom">Somewhere else…</option>
              </select></div>
            ${f.finishPick === '__custom' ? html`
              <div class="field"><label for="ps-finish">Place</label><input id="ps-finish" type="text" maxlength="60" placeholder="Name of the café or spot" value=${f.finish} onInput=${e => set('finish', e.target.value)} /></div>
              <div class="field"><label for="ps-finish-spot">Closest trail spot</label><select id="ps-finish-spot" value=${f.finishSpot} onChange=${e => set('finishSpot', e.target.value)}>${SPOTS.map(sp => html`<option key=${sp.id} value=${sp.id}>${sp.name}</option>`)}</select></div>
              <div class="field"><span class="lbl">Distance from the trail</span><${Stepper} id="ps-finish-off" label="finish distance from the trail" value=${f.finishOff} min=${0} max=${1.5} step=${0.1} fmt=${v => mi1(v) + ' mi'} onChange=${v => set('finishOff', v)} /></div>` : null}
            <span class="hint">Everyone's miles home count from here.</span>
          </div>` : html`<span class="hint">Ends where it starts.</span>`}</div>
        <div class="row2">
          <div class="field"><span class="lbl">Pace</span><${Stepper} id="ps-pace" label="pace" value=${f.pace} min=${300} max=${780} step=${5} fmt=${v => pace(v) + ' /mi'} onChange=${v => set('pace', v)} /></div>
          <div class="field"><span class="lbl">Run distance</span><${Stepper} id="ps-dist" label="distance" value=${f.dist} min=${1} max=${20} step=${0.5} fmt=${v => distTxt(v) + ' mi'} onChange=${v => set('dist', v)} /></div>
        </div>
        <div class="field"><span class="lbl">Who can see it</span><${Seg} label="Who can see it" value=${f.vis} onChange=${v => set('vis', v)} options=${VIS_OPTS} />
          <span class="hint">${VIS_HINT[f.vis]}</span>
          ${lonely ? html`<span class="warnline">You have no friends on In. yet, so nobody else will see this. Add friends first or post it to All Wharton.</span>` : null}</div>
        <div class="field"><label for="ps-note">Anything else<span class="opt">optional</span></label>
          <input id="ps-note" type="text" maxlength="90" placeholder="Strides at the end, coffee after" value=${f.note} onInput=${e => set('note', e.target.value)} /></div>
        ${problems.map(p => html`<p key=${p} class="err">${p}</p>`)}
        <div class="sheet-actions">
          <button type="button" class="btn btn-text" onClick=${onClose}>Cancel</button>
          <button type="submit" class="btn btn-go btn-lg" disabled=${busy}>${editing ? 'Save changes' : isInt ? 'Propose run' : 'Post run'}</button>
        </div>
      </form>
    <//>`;
  }

  function LockSheet({ M, runId, onClose, act }) {
    const run = M.runById[runId];
    const joinKey = run ? run.joiners.map(j => j.id).join(',') : '';
    const parts = useMemo(() => (run ? participantsOf(run, M.profiles).filter(p => !isSample(p.id)) : []), [runId, joinKey]);
    const bots = run ? run.joiners.filter(j => isSample(j.id)).length : 0;
    const sug = useMemo(() => (run ? nashSuggest(parts, run) : null), [parts]);
    const [choice, setChoice] = useState(null);
    const [busy, setBusy] = useState(false);
    if (!run || !sug || run.status !== 'intention' || run.faded) {
      return html`<${Sheet} title="Confirm this run" onClose=${onClose}>
        <p class="sheet-body-pad">This run can't be confirmed anymore. Proposed runs have to be confirmed by 10 PM the night before.</p>
      <//>`;
    }
    const c = choice || { start: run.start, key: sug.key, pace: sug.pace };
    const set = (k, v) => setChoice(Object.assign({}, c, { [k]: v }));
    const candOf = k => (k === 'place' ? { key: 'place', mi: spotMi(run.spot), off: offOf(run.place, run.placeOff) } : { key: k, mi: spotMi(k), off: 0 });
    const cand = candOf(c.key);
    const gains = gainsAt(parts, cand, c.pace, run.place ? 'place' : run.spot);
    const keyName = k => (k === 'place' ? run.place : spotName(k));
    const onSug = c.key === sug.key && c.pace === sug.pace && c.start === run.start;
    const alone = parts.length === 1;
    const times = [];
    for (let t = run.start - 30; t <= run.start + 30; t += 5) times.push(t);
    const who = p => (p.id === M.me ? 'You' : M.fullNameOf(p.id));
    const submit = async e => {
      e.preventDefault();
      if (busy) return;
      setBusy(true);
      const ok = await act.lock(run, c);
      setBusy(false);
      if (ok) onClose();
    };
    const sub = 'Confirming sets the exact time, start and pace. ' + (alone ? 'No one has said they’d be in yet.' : 'The ' + (parts.length - 1) + (parts.length === 2 ? ' person' : ' people') + ' who said I’d be in are then going.') + (bots ? ' Bots tag along but don’t shape the plan.' : '');
    return html`<${Sheet} title=${'Confirm ' + run.title} sub=${sub} onClose=${onClose}>
      <div class="sug">
        <p class="sug-k">Suggested</p>
        <p class="sug-v">${keyName(sug.key)} at ${pace(sug.pace)}/mi</p>
        <p class="hint">${alone ? 'With just you, the suggestion is your plan as posted.' : 'Picked so the compromise is shared: it maximizes the product of everyone’s gains. Running faster than you like counts for more than running slower.'}</p>
      </div>
      <ul class="plist">${parts.map((p, i) => {
        const dp = c.pace - p.pace;
        const det = reach(p, cand);
        return html`<li key=${p.id}>
          <${Avatar} id=${p.id} M=${M} size=${28} />
          <span class="pl-n">${who(p)}${p.host ? ' (host)' : ''}</span>
          <span class="pl-m">${det < 0.05 ? 'starts at their trail spot' : mi1(det) + ' mi from their trail spot'} · ${dp === 0 ? 'their pace' : Math.abs(dp) + 's/mi ' + (dp > 0 ? 'slower' : 'faster')}</span>
          ${gains[i] <= 0 ? html`<span class="pl-w">may skip</span>` : null}
        </li>`;
      })}</ul>
      <p class="hint" style="margin:0 0 16px">Miles count from each runner's trail spot. Door-to-trail miles are private and the same wherever you meet, so they're left out.</p>
      <form class="form" onSubmit=${submit}>
        <div class="row2">
          <div class="field"><label for="lk-time">Start time</label>
            <select id="lk-time" value=${c.start} onChange=${e => set('start', Number(e.target.value))}>${times.map(t => html`<option key=${t} value=${t}>${clock(t)}</option>`)}</select></div>
          <div class="field"><label for="lk-spot">Start</label>
            <select id="lk-spot" value=${c.key} onChange=${e => set('key', e.target.value)}>
              ${run.place ? html`<option value="place">${shortPlace(run.place)}${sug.key === 'place' ? ' (suggested)' : ''}</option>` : null}
              ${SPOTS.map(s => html`<option key=${s.id} value=${s.id}>${s.name}${s.id === sug.key ? ' (suggested)' : ''}</option>`)}
            </select></div>
        </div>
        <div class="field"><span class="lbl">Pace</span><${Stepper} id="lk-pace" label="pace" value=${c.pace} min=${300} max=${780} step=${5} fmt=${v => pace(v) + ' /mi'} onChange=${v => set('pace', v)} /></div>
        ${!onSug ? html`<p class="hint">You changed the plan. <button type="button" class="linkish" onClick=${() => setChoice(null)}>Go back to the suggestion</button></p>` : null}
        <div class="sheet-actions">
          <button type="button" class="btn btn-text" onClick=${onClose}>Not yet</button>
          <button type="submit" class="btn btn-go btn-lg" disabled=${busy}>Confirm run</button>
        </div>
      </form>
    <//>`;
  }

  function Footer({ M }) {
    return html`<footer class="foot">
      ${M && M.mode === 'live' && M.ready ? html`<p>Live board, ${M.realCount} ${M.realCount === 1 ? 'runner' : 'runners'} so far.${M.samplesOn ? ' People marked Bot aren’t real. They fill out runs during the beta.' : ''}</p>` : null}
      ${M && M.mode === 'sandbox' ? html`<p>Sandbox: your posts stay in this browser.${M.samplesOn ? ' People marked Bot aren’t real. They fill out runs during the beta.' : ''}</p>` : null}
      <p>One trail: the Schuylkill River Trail from Grays Ferry Crescent to Manayunk. Distances are approximate: city blocks around Rittenhouse and Penn, miles along the trail.</p>
      <p>In. is a student project for Wharton runners, not affiliated with the Wharton School.</p>
    </footer>`;
  }

  function makeActions(ctx) {
    const say = ctx.say, getM = ctx.getM;
    const api = () => Store.api;
    const pairDoc = (x, y, from, to, status) => ({ a: x < y ? x : y, b: x < y ? y : x, from, to, status, at: Date.now() });
    return {
      async saveProfile(p, home) {
        if (!(await write(() => api().saveProfile(p), null, say))) return false;
        await write(() => api().saveHome(home), null, say);
        say('Runner card saved.');
        return true;
      },
      async setTravel(mode) {
        const M = getM();
        if (!M.meP || M.meP.travel === mode) return;
        const p = Object.assign({}, M.meP, { travel: mode, updatedAt: Date.now() });
        delete p.id;
        await write(() => api().saveProfile(p), mode === 'walk' ? 'Leave and home times now assume you walk to runs.' : 'Leave and home times now assume you jog to runs.', say);
      },
      // kind: 'in' (the default) or 'maybe'. Maybes don't commit you, so they never clash with other runs.
      async join(r, kind) {
        const M = getM();
        if (!M.meP) { ctx.openProfile(true); return; }
        const me = Store.me;
        const maybe = kind === 'maybe';
        let swapped = '';
        if (!maybe) {
          // You can only be in one place at a time: runs overlap if their windows (plus 30 min to get between them) touch.
          const span = x => [x.start - 30, x.start + (x.dist * x.pace) / 60 + 30];
          const [a0, a1] = span(r);
          const clash = M.runs.filter(x => x.id !== r.id && x.date === r.date && x.status !== 'cancelled' && !x.faded && !x.past && (x.host === me || x.joinedByMe))
            .filter(x => { const [b0, b1] = span(x); return a0 < b1 && b0 < a1; });
          const hosting = clash.find(x => x.host === me);
          if (hosting) { say('You’re hosting ' + hosting.title + ' at ' + clock(hosting.start) + ', which overlaps. Cancel it first to join this one.'); return; }
          for (const x of clash) { if (!(await write(() => api().deleteJoin(x.id + '__' + me), null, say))) return; }
          swapped = clash.length ? ' You’re out of ' + clash.map(x => x.title).join(' and ') + ', which overlapped.' : '';
        }
        const confirmsTxt = r.host ? M.nameOf(r.host) + ' confirms by 10 PM the night before.' : 'It needs someone to take over as host and confirm it by 10 PM the night before.';
        const msg = maybe ? 'You’re a maybe for ' + r.title + '.' : (isProposed(r) ? 'You’d be in. ' + confirmsTxt : 'You’re going. It’s at the top of your runs.') + swapped;
        const ok = await write(() => api().setJoin(r.id + '__' + me, { run: r.id, user: me, date: r.date, at: Date.now(), kind: maybe ? 'maybe' : 'in' }), msg, say);
        if (ok && !maybe) ctx.afterJoin();
      },
      async leave(r) { await write(() => api().deleteJoin(r.id + '__' + Store.me), 'You’re out of ' + r.title + '.', say); },
      async stepDown(r) { await write(() => api().stepDown(r.id), 'You dropped out as host. The run stays up, and anyone going can take over.', say); },
      async takeOver(r) {
        const ok = await write(() => api().takeOver(r.id), 'You’re hosting ' + r.title + ' now.' + (isProposed(r) ? ' Confirm it by 10 PM the night before.' : ''), say);
        if (ok) ctx.afterJoin();
      },
      sendMessage(r, body) { return write(() => api().sendMessage(r.id, body.slice(0, 500)), null, say); },
      deleteMessage(m) { return write(() => api().deleteMessage(m.id), null, say); },
      async createRun(doc) {
        const id = api().newRunId();
        const full = Object.assign({}, doc, { host: Store.me, createdAt: Date.now(), lockedAt: doc.status === 'locked' ? Date.now() : 0 });
        const ok = await write(() => api().setRun(id, full), doc.status === 'intention' ? 'Proposed. Confirm it by 10 PM the night before.' : 'Posted. It’s in your runs at the top.', say);
        if (ok) ctx.afterJoin();
        return ok;
      },
      async editRun(r, doc) {
        const patch = Object.assign({}, doc);
        if (doc.status === 'locked' && r.status !== 'locked') patch.lockedAt = Date.now();
        return write(() => api().updateRun(r.id, patch), 'Run updated.', say);
      },
      async lock(r, c) {
        const samplesIn = r.joiners.filter(j => j.virtual).map(j => j.id);
        const where = lockedPlace(r, c.key);
        return write(() => api().updateRun(r.id, { status: 'locked', start: c.start, spot: where.spot, place: where.place, placeOff: where.placeOff, placeId: where.placeId, pace: c.pace, lockedAt: Date.now(), samplesIn }), 'Confirmed. Everyone who said they’d be in is going.', say);
      },
      async cancel(r) { await write(() => api().updateRun(r.id, { status: 'cancelled' }), 'Run cancelled.', say); },
      async request(id) {
        const M = getM(), me = Store.me;
        const sample = isSample(id);
        await write(() => api().setFriendship(pairId(me, id), pairDoc(me, id, me, id, sample ? 'accepted' : 'pending')),
          sample ? 'You and ' + M.nameOf(id) + ' are friends. Their runs, and their friends’ runs, can now show on your board.' : 'Request sent to ' + M.nameOf(id) + '.', say);
      },
      async accept(x) {
        const M = getM(), me = Store.me;
        const op = x.virtual ? () => api().setFriendship(x.fid, pairDoc(me, x.other, x.other, me, 'accepted')) : () => api().updateFriendship(x.fid, { status: 'accepted', at: Date.now() });
        await write(op, 'You and ' + M.nameOf(x.other) + ' are friends. Their runs, and their friends’ runs, can now show on your board.', say);
      },
      async decline(x) {
        const me = Store.me;
        const op = x.virtual ? () => api().setFriendship(x.fid, pairDoc(me, x.other, x.other, me, 'declined')) : () => api().deleteFriendship(x.fid);
        await write(op, 'Request declined.', say);
      },
      async unfriend(id) { await write(() => api().updateFriendship(pairId(Store.me, id), { status: 'removed', at: Date.now() }), 'Removed from your friends.', say); },
      async cancelRequest(x) { await write(() => api().deleteFriendship(x.fid), 'Request cancelled.', say); },
      async setSamples(on) {
        await write(() => api().setConfig({ samples: !!on }), on ? 'Beta bots are on.' : 'Beta bots are off' + (Store.mode === 'live' ? ' for everyone.' : '.'), say);
      },
      resetSandbox() { Sandbox.reset(); say('Sandbox reset.'); },
    };
  }

  function App() {
    const [ver, setVer] = useState(0);
    // Subscribe, then catch up on anything the store did before this effect ran (the sandbox boots synchronously).
    useEffect(() => { const off = Store.on(() => setVer(v => v + 1)); setVer(v => v + 1); return off; }, []);
    const [now, setNow] = useState(() => new Date());
    useEffect(() => { const t = setInterval(() => setNow(new Date()), 5000); return () => clearInterval(t); }, []);
    const M = useMemo(() => buildModel(now), [now, ver]);
    const Mref = useRef(M);
    Mref.current = M;
    const [tab, setTabRaw] = useState(() => (lsGet('in-tab') === 'friends' ? 'friends' : 'runs'));
    const setTab = useCallback(t => { setTabRaw(t); lsSet('in-tab', t); }, []);
    const [sheet, setSheet] = useState(null);
    const [toast, setToast] = useState(null);
    const say = useCallback(msg => setToast({ msg, k: Date.now() + Math.random() }), []);
    useEffect(() => { if (!toast) return undefined; const t = setTimeout(() => setToast(null), 3800); return () => clearTimeout(t); }, [toast]);
    useEffect(() => { document.body.classList.toggle('sheet-open', !!sheet); }, [sheet]);
    useEffect(() => { resolvePeople(); }, [ver]);
    const close = useCallback(() => setSheet(null), []);
    const openProfile = useCallback(onb => setSheet({ type: 'profile', onboarding: !!onb }), []);
    const openPost = useCallback(opts => {
      const m = Mref.current;
      if (!m.canWrite) return;
      if (!m.meP) { setSheet({ type: 'profile', onboarding: true }); return; }
      setSheet({ type: 'post', opts: opts || null });
    }, []);
    const openLock = useCallback(r => setSheet({ type: 'lock', runId: r.id }), []);
    const onOpen = useCallback(r => setSheet({ type: 'run', runId: r.id }), []);
    const act = useMemo(() => makeActions({
      say, getM: () => Mref.current, openProfile,
      // After joining or posting, the page reorganizes around the commitment, so bring its top into view.
      afterJoin: () => {
        setTab('runs');
        window.requestAnimationFrame(() => { try { window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, 0); } });
      },
    }), []);

    const asked = useRef(false);
    useEffect(() => {
      if (asked.current || !M.ready || !M.homeLoaded || !M.canWrite || !M.me || M.meP) return;
      asked.current = true;
      setSheet(s => s || { type: 'profile', onboarding: true });
    }, [M.ready, M.homeLoaded, M.canWrite, M.me, !!M.meP]);

    const seen = useRef(null);
    useEffect(() => {
      if (!M.ready || !M.me) return;
      const cur = new Map();
      M.runs.forEach(r => { if (r.host === M.me && !r.sample) cur.set(r.id, r.joiners.filter(j => !isSample(j.id)).map(j => j.id)); });
      const prev = seen.current;
      seen.current = cur;
      if (!prev) return;
      cur.forEach((ids, rid) => {
        const p = prev.get(rid);
        if (!p) return;
        const fresh = ids.filter(id => p.indexOf(id) === -1);
        if (!fresh.length) return;
        const r = M.runById[rid];
        say(M.nameOf(fresh[0]) + (fresh.length > 1 ? ' and ' + (fresh.length - 1) + ' more' : '') + (isProposed(r) ? ' would be in' : ' is going') + ' for ' + r.title + ' ' + whenRef(r.date, M.todayK) + '.');
      });
    }, [M]);

    const sheetRun = sheet && sheet.type === 'run' ? M.runById[sheet.runId] : null;
    if (M.mode === 'signin') return html`<${SignIn} />`;
    if (M.mode === 'setup') return html`<${SetupNotice} problem=${Store.setupProblem} />`;

    return html`
      <${TopBar} M=${M} onMe=${() => openProfile(!M.meP)} onPost=${() => openPost()} />
      <div class="wrap">
        <main>
          <${Tabs} tab=${tab} setTab=${setTab} reqCount=${M.meP ? M.incoming.length : 0} />
          ${tab === 'friends'
            ? html`<${FriendsView} M=${M} act=${act} openProfile=${() => openProfile(true)} />`
            : html`<${RunList} M=${M} now=${now} onOpen=${onOpen} act=${act} openLock=${openLock} openPost=${openPost} goFriends=${() => setTab('friends')} openProfile=${() => openProfile(true)} />`}
          <${Footer} M=${M} />
        </main>
      </div>
      ${sheet && sheet.type === 'run' ? html`<${Sheet} title="Run details" bare=${true} onClose=${close}><${RunDetail} r=${sheetRun} M=${M} now=${now} act=${act} openLock=${r => setSheet({ type: 'lock', runId: r.id })} openPost=${o => { setSheet(null); openPost(o); }} /><//>` : null}
      ${sheet && sheet.type === 'profile' ? html`<${ProfileSheet} M=${M} onboarding=${sheet.onboarding} onClose=${close} act=${act} />` : null}
      ${sheet && sheet.type === 'post' ? html`<${PostSheet} M=${M} now=${now} opts=${sheet.opts} onClose=${close} act=${act} />` : null}
      ${sheet && sheet.type === 'lock' ? html`<${LockSheet} M=${M} runId=${sheet.runId} onClose=${close} act=${act} />` : null}
      <div class="toast-wrap" role="status" aria-live="polite">${toast ? html`<div class="toast" key=${toast.k}>${toast.msg}</div>` : null}</div>
    `;
  }

  root.textContent = '';
  render(html`<${App} />`, root);
  boot();
})();
</script>
</body>
</html>
