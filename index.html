    },
    async signOut() { this.stop(); await this.sb.auth.signOut(); },
    async sendCode(email) {
      const { error } = await this.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
    },
    async verifyCode(email, token) {
      const { error } = await this.sb.auth.verifyOtp({ email, token, type: 'email' });
      if (error) throw error;
    },
    async google() {
      const { error } = await this.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      if (error) throw error;
    },
    // ----- reading -----
    since() { return dateKey(addDays(new Date(), -1)); },
    async fetch(what) {
      const sb = this.sb, me = this.uid;
      if (what === 'profiles') {
        const { data, error } = await sb.from('profiles').select('*');
        if (error) throw error;
        const o = {};
        data.forEach(p => { o[p.id] = { handle: p.handle, spot: p.spot, pace: p.pace, travel: p.travel, vis: p.vis, updatedAt: msOf(p.updated_at) }; });
        Store.profiles = o;
      } else if (what === 'friendships') {
        const { data, error } = await sb.from('friendships').select('*');
        if (error) throw error;
        const o = {};
        data.forEach(f => { o[f.a + '__' + f.b] = { a: f.a, b: f.b, from: f.from_id, to: f.to_id, status: f.status, at: msOf(f.at) }; });
        this.rows.friendships = o;
        Store.friendships = Object.assign({}, o, this.local.friendships);
      } else if (what === 'runs') {
        const { data, error } = await sb.from('runs').select('*').gte('date', this.since());
        if (error) throw error;
        const o = {};
        data.forEach(r => { o[r.id] = runFromRow(r); });
        Store.runs = o;
      } else if (what === 'joins') {
        const { data, error } = await sb.from('joins').select('*').gte('date', this.since());
        if (error) throw error;
        const o = {};
        data.forEach(j => { o[j.run_id + '__' + j.user_id] = { run: j.run_id, user: j.user_id, date: j.date, at: msOf(j.at), kind: j.kind || 'in' }; });
        this.rows.joins = o;
        Store.joins = Object.assign({}, o, this.local.joins);
      } else if (what === 'config') {
        const { data, error } = await sb.from('app_config').select('*').eq('id', 'app').maybeSingle();
        if (error) throw error;
        Store.config = data ? { samples: data.samples } : {};
      } else if (what === 'home') {
        const { data, error } = await sb.from('homes').select('*').eq('id', me).maybeSingle();
        if (error) throw error;
        Store.home = data ? Object.assign({}, typeof data.st === 'number' ? { st: data.st, cross: data.cross_street } : {}, data.dist != null ? { dist: Number(data.dist) } : {}) : null;
      }
      if (what in Store.loaded) Store.loaded[what] = true;
    },
    async loadAll() {
      if (!this.uid) return;
      const uid = this.uid;
      const res = await Promise.allSettled(['profiles', 'friendships', 'runs', 'joins', 'config', 'home'].map(w => this.fetch(w)));
      if (this.uid !== uid) return;
      const bad = res.find(r => r.status === 'rejected');
      if (bad) {
        console.warn('In. load', bad.reason);
        // Right after sign-in Supabase can briefly reject a fresh token ("JWT issued at future"), so try again shortly.
        if (!this.retry) this.retry = setTimeout(() => { this.retry = null; this.loadAll(); }, 2000);
      }
      Store.emit();
    },
    soon(what) {
      clearTimeout(this.timers[what]);
      this.timers[what] = setTimeout(() => { if (this.uid) this.fetch(what).then(() => Store.emit(), e => console.warn('In. refresh', e)); }, 250);
    },
    async run(q, after) {
      const { data, error } = await q;
      if (error) throw cloudError(error);
      if (after) this.soon(after);
      return data;
    },
    // ----- local sample-classmate interactions -----
    saveLocal() { lsSet('in-local-' + this.uid, JSON.stringify(this.local)); },
    localPut(kind, id, doc) {
      this.local[kind] = Object.assign({}, this.local[kind], { [id]: doc });
      this.saveLocal();
      Store[kind] = Object.assign({}, this.rows[kind], this.local[kind]);
      Store.emit();
    },
    localDrop(kind, id) {
      const o = Object.assign({}, this.local[kind]); delete o[id]; this.local[kind] = o;
      this.saveLocal();
      Store[kind] = Object.assign({}, this.rows[kind], this.local[kind]);
      Store.emit();
    },
    // ----- writing (the same calls the app makes in every mode) -----
    async saveProfile(p) {
      await this.run(this.sb.from('profiles').upsert({ id: this.uid, handle: p.handle, spot: p.spot, pace: p.pace, travel: p.travel || 'walk', vis: p.vis || 'fof', updated_at: iso() }), 'profiles');
      Store.profiles = Object.assign({}, Store.profiles, { [this.uid]: p }); Store.emit();
    },
    async saveHome(h) {
      const corner = typeof h.st === 'number';
      await this.run(this.sb.from('homes').upsert({ id: this.uid, st: corner ? h.st : null, cross_street: corner ? h.cross : null, dist: corner ? null : typeof h.dist === 'number' ? h.dist : null, updated_at: iso() }));
      Store.home = h; Store.emit();
    },
    async setFriendship(id, d) {
      if (isSample(d.a) || isSample(d.b)) return this.localPut('friendships', id, d);
      await this.run(this.sb.from('friendships').upsert({ a: d.a, b: d.b, from_id: d.from, to_id: d.to, status: d.status, at: iso(d.at) }, { onConflict: 'a,b' }), 'friendships');
    },
    async updateFriendship(id, p) {
      if (this.local.friendships[id]) return this.localPut('friendships', id, Object.assign({}, this.local.friendships[id], p));
      const [a, b] = id.split('__');
      const row = {};
      if (p.status) row.status = p.status;
      if (p.at) row.at = iso(p.at);
      const data = await this.run(this.sb.from('friendships').update(row).eq('a', a).eq('b', b).select('a'), 'friendships');
      if (!data || !data.length) throw { code: 'denied', message: 'Nothing to update' };
    },
    async deleteFriendship(id) {
      if (this.local.friendships[id]) return this.localDrop('friendships', id);
      // Declined and cancelled requests are marked removed, not deleted: Supabase broadcasts deletes
      // to everyone listening, and who asked whom should stay between the two of them.
      const [a, b] = id.split('__');
      const data = await this.run(this.sb.from('friendships').update({ status: 'removed', at: iso() }).eq('a', a).eq('b', b).select('a'), 'friendships');
      if (!data || !data.length) throw { code: 'denied', message: 'Nothing to update' };
    },
    async setRun(id, d) {
      await this.run(this.sb.from('runs').upsert(Object.assign({ id }, runToRow(d))), 'runs');
      Store.runs = Object.assign({}, Store.runs, { [id]: Object.assign({ samplesIn: [], lockedAt: 0 }, d) }); Store.emit();
    },
    async updateRun(id, p) {
      const data = await this.run(this.sb.from('runs').update(runToRow(p)).eq('id', id).select('id'), 'runs');
      if (!data || !data.length) throw { code: 'denied', message: 'Nothing to update' };
      if (Store.runs[id]) { Store.runs = Object.assign({}, Store.runs, { [id]: Object.assign({}, Store.runs[id], p) }); Store.emit(); }
    },
    async setJoin(id, d) {
      if (String(d.run).indexOf('tpl-') === 0) return this.localPut('joins', id, d);
      await this.run(this.sb.from('joins').upsert({ run_id: d.run, user_id: this.uid, date: d.date, at: iso(d.at), kind: d.kind === 'maybe' ? 'maybe' : 'in' }, { onConflict: 'run_id,user_id' }), 'joins');
      Store.joins = Object.assign({}, Store.joins, { [id]: d }); Store.emit();
    },
    async deleteJoin(id) {
      if (this.local.joins[id]) return this.localDrop('joins', id);
      const run = id.slice(0, id.lastIndexOf('__'));
      await this.run(this.sb.from('joins').delete().eq('run_id', run).eq('user_id', this.uid), 'joins');
      const o = Object.assign({}, Store.joins); delete o[id]; Store.joins = o; Store.emit();
    },
    async setConfig(c) {
      const data = await this.run(this.sb.from('app_config').update({ samples: !!c.samples, updated_at: iso() }).eq('id', 'app').select('id'), 'config');
      if (!data || !data.length) throw { code: 'denied', message: 'Only the app admin can change this' };
      Store.config = Object.assign({}, Store.config, { samples: !!c.samples }); Store.emit();
    },
    newRunId() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); },
    // ----- hosts dropping out and taking over (the database checks who may) -----
    async stepDown(id) { await this.run(this.sb.rpc('step_down', { p_run: id }), 'runs'); },
    async takeOver(id) { await this.run(this.sb.rpc('take_over', { p_run: id }), 'runs'); this.soon('joins'); },
    // ----- chat on a run: only the open run's messages are loaded -----
    thread: null, threadPoll: null,
    openThread(runId) {
      if (this.thread === runId) return;
      this.closeThread();
      this.thread = runId;
      Store.thread = { runId, items: [], loaded: false };
      this.loadThread();
      this.threadPoll = setInterval(() => { if (!document.hidden) this.loadThread(); }, 15000);
    },
    closeThread() {
      if (this.threadPoll) { clearInterval(this.threadPoll); this.threadPoll = null; }
      this.thread = null;
      Store.thread = null;
    },
    async loadThread() {
      const runId = this.thread;
      if (!runId || !this.sb) return;
      const { data, error } = await this.sb.from('messages').select('id,user_id,body,at').eq('run_id', runId).order('at', { ascending: true }).limit(300);
      if (this.thread !== runId) return;
      if (error) { console.warn('In. chat', error); return; }
      Store.thread = { runId, loaded: true, items: data.map(m => ({ id: m.id, user: m.user_id, body: m.body, at: msOf(m.at) })) };
      Store.emit();
    },
    async sendMessage(runId, body) {
      await this.run(this.sb.from('messages').insert({ run_id: runId, user_id: this.uid, body }));
      if (this.thread === runId) await this.loadThread();
    },
    async deleteMessage(id) {
      await this.run(this.sb.from('messages').delete().eq('id', id).eq('user_id', this.uid));
      await this.loadThread();
    },
  };

  let peopleKey = '';
  function resolvePeople() {
    if (Store.mode !== 'live' || !Live.user || typeof Live.user.profiles !== 'function') return;
    const ids = new Set(Object.keys(Store.profiles));
    Object.values(Store.friendships).forEach(f => { if (f) { ids.add(f.a); ids.add(f.b); } });
    Object.values(Store.joins).forEach(j => { if (j) ids.add(j.user); });
    Object.values(Store.runs).forEach(r => { if (r) ids.add(r.host); });
    if (Store.me) ids.add(Store.me);
    const list = Array.from(ids).filter(id => id && !isSample(id) && id.indexOf('g-') !== 0).sort();
    const key = list.join('|');
    if (!list.length || key === peopleKey) return;
    peopleKey = key;
    Promise.resolve(Live.user.profiles(list)).then(ps => { Store.people = ps || {}; Store.emit(); }).catch(() => {});
  }

  async function boot() {
    // With a config.js present this is the shared app: it runs on Supabase or explains what's missing,
    // never quietly falling back to a private sandbox that nobody else can see.
    if (window.IN_CONFIG || document.querySelector('script[src="config.js"]')) {
      const p = Cloud.problem();
      if (p) { Object.assign(Store, { mode: 'setup', setupProblem: p }); Store.emit(); return; }
      Cloud.start();
      return;
    }
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { Sandbox.init('standalone'); return; }
    let db = null, user = null;
    try { const res = await Promise.all([c.use('db'), c.use('user')]); db = res[0]; user = res[1]; } catch (e) { console.warn('In. capabilities', e); }
    if (!db) { Sandbox.init('no-db'); return; }
    try { await Live.init(db, user); } catch (e) { console.warn('In. live init failed', e); Sandbox.init('error'); }
  }

  async function write(op, okMsg, say) {
    try {
      await op();
      if (okMsg) say(okMsg);
      return true;
    } catch (e) {
      console.warn('In. write failed', e);
      const code = e && e.code;
      if (code === 'denied') say('That change isn’t allowed. Refresh and try again.');
      else if (code === 'invalid') say('Something in that didn’t fit. Check the details and try again.');
      else if (code === 'auth') say('You’ve been signed out. Sign in again to save changes.');
      else if (Store.mode === 'live' && code === 'invalid_argument') {
        Store.canWrite = false; Store.emit();
        say('This board is view-only for you. Ask the owner for edit access.');
      } else if (code === 'quota_exceeded') say('The board is full. Old runs need clearing before new ones fit.');
      else if (code === 'resource_exhausted') say('Too many changes at once. Wait a moment and try again.');
      else say("That didn't save. Check your connection and try again.");
      return false;
    }
  }

  /* ---------------- The model: everything the screen needs, derived fresh ---------------- */
  function buildModel(now) {
    const me = Store.me;
    const realRunners = Object.keys(Store.profiles || {}).filter(id => !isSample(id)).length;
    const samplesOn = !(Store.config && Store.config.samples === false) && realRunners < BOTS_UNTIL;
    const nowMs = now.getTime();
    const todayK = dateKey(now);
    const sinceK = dateKey(addDays(now, -1));
    const off = id => !samplesOn && isSample(id);

    const profiles = {};
    if (samplesOn) SAMPLES.forEach(s => { profiles[s.id] = s; });
    Object.keys(Store.profiles || {}).forEach(id => {
      const p = Store.profiles[id];
      if (p && !isSample(id) && SPOT[p.spot]) profiles[id] = Object.assign({}, p, { id });
    });
    const meP = me && profiles[me] && !profiles[me].sample ? profiles[me] : null;

    const fr = new Map();
    const link = (a, b) => { if (!fr.has(a)) fr.set(a, new Set()); fr.get(a).add(b); };
    if (samplesOn) SAMPLE_EDGES.forEach(e => { link(e[0], e[1]); link(e[1], e[0]); });
    const incoming = [], outgoing = [], touched = new Set();
    Object.keys(Store.friendships || {}).forEach(fid => {
      const f = Store.friendships[fid];
      if (!f || !f.a || !f.b || isSample(f.a) || isSample(f.b)) return;
      if (f.status === 'accepted') { link(f.a, f.b); link(f.b, f.a); }
      if (me && (f.a === me || f.b === me)) {
        const other = f.a === me ? f.b : f.a;
        touched.add(other);
        if (f.status === 'pending') (f.to === me ? incoming : outgoing).push({ fid, other });
      }
    });
    const EMPTY = new Set();
    const F = id => fr.get(id) || EMPTY;

    const runs = [];
    Object.keys(Store.runs || {}).forEach(id => {
      const r = Store.runs[id];
      if (!r || !r.date || r.date < sinceK || off(r.host) || !SPOT[r.spot]) return;
      runs.push(Object.assign({}, r, { id, sample: false }));
    });
    const joinsBy = {};
    Object.keys(Store.joins || {}).forEach(jid => {
      const j = Store.joins[jid];
      if (!j || !j.run || !j.user || off(j.user)) return;
      (joinsBy[j.run] = joinsBy[j.run] || []).push({ id: j.user, at: j.at || 0, kind: j.kind === 'maybe' ? 'maybe' : 'in' });
    });
    runs.forEach(r => {
      const tt = typeof r.title === 'string' ? r.title.trim() : '';
      r.titleAuto = !tt;
      r.title = tt || autoTitle(r.start);
      r.place = r.place || '';
      r.finish = r.finish || '';
      r.placeId = PLACE[r.placeId] ? r.placeId : '';
      r.finishId = typeof r.finishId === 'string' ? r.finishId : '';
      r.placeOff = offOf(r.place, r.placeOff);
      r.startMi = spotMi(r.spot);
      r.lockBy = lockByFor(r.date);
      const js = (joinsBy[r.id] || []).filter(j => j.id !== r.host && profiles[j.id]);
      js.sort((a, b) => a.at - b.at);
      // joiners are the people who are in; maybes are interested but not committed.
      r.joiners = js.filter(j => j.kind !== 'maybe');
      r.maybes = js.filter(j => j.kind === 'maybe');
    });
    const canSee = (v, r) => {
      const org = r.host || r.leftBy || null;  // a run whose host dropped out keeps that host's audience
      if (org && org === v) return true;
      if (v && (r.joiners.some(j => j.id === v) || r.maybes.some(j => j.id === v))) return true;
      if (r.vis === 'wharton') return true;
      if (!v || !org) return false;
      const hf = F(org);
      if (hf.has(v)) return true;
      if (r.vis === 'fof') { for (const f of F(v)) if (hf.has(f)) return true; }
      return false;
    };
    if (samplesOn) {
      runs.forEach(r => {
        if (r.sample || r.status === 'cancelled') return;
        // Sample classmates who were in when the host locked stay in.
        const kept = Array.isArray(r.samplesIn) ? r.samplesIn.filter(id => profiles[id] && id !== r.host && !r.joiners.some(j => j.id === id)) : [];
        kept.forEach(id => r.joiners.push({ id, at: r.createdAt || 0, sample: true, virtual: true }));
        const cands = SAMPLES.filter(s => s.id !== r.host && !r.joiners.some(j => j.id === s.id) && sampleFits(s, r) && canSee(s.id, r))
          .sort((a, b) => Math.abs(a.pace - r.pace) - Math.abs(b.pace - r.pace) || (a.id < b.id ? -1 : 1))
          .slice(0, Math.max(0, 3 - kept.length));
        cands.forEach((s, k) => {
          const at = (r.createdAt || 0) + 6000 + 7000 * k;
          if (nowMs >= at) r.joiners.push({ id: s.id, at, sample: true, virtual: true });
        });
      });
    }
    runs.forEach(r => {
      r.faded = false; r.autoLocked = false;
      if (r.status === 'intention' && nowMs >= r.lockBy.getTime()) {
        if (r.sample) {
          // Lock with the people who were in by 10 PM; later joiners don't move a locked run.
          const atLock = Object.assign({}, r, { joiners: r.joiners.filter(j => (j.at || 0) < r.lockBy.getTime()) });
          const sug = nashSuggest(participantsOf(atLock, profiles), r);
          if (sug) Object.assign(r, lockedPlace(r, sug.key), { status: 'locked', pace: sug.pace, autoLocked: true });
        } else r.faded = true;
      }
      r.startMi = spotMi(r.spot);
      r.finishMi = r.finish ? spotMi(r.finishSpot || r.spot) : r.startMi;
      r.finishOff = r.finish ? offOf(r.finish, r.finishOff) : r.placeOff;
      r.legs = myLegs(r, meP, Store.home);
      r.startAt = atMin(r.date, r.start);
      r.past = nowMs > r.startAt.getTime() + 30 * 60000;
      r.started = !r.past && nowMs >= r.startAt.getTime();
      r.joinedByMe = !!me && r.joiners.some(j => j.id === me);
      r.maybeByMe = !!me && r.maybes.some(j => j.id === me);
    });
    const F1 = me ? F(me) : EMPTY, F2 = new Set();
    F1.forEach(f => F(f).forEach(x => { if (x !== me && !F1.has(x)) F2.add(x); }));
    runs.forEach(r => {
      const ppl = [r.host].concat(r.joiners.map(j => j.id), r.maybes.map(j => j.id)).filter(id => id && id !== me && !isSample(id));
      r.circle = ppl.some(id => F1.has(id)) ? 'friends' : ppl.some(id => F2.has(id)) ? 'fof' : 'wharton';
    });

    const days = [], byDay = {}, runById = {};
    let hiddenTotal = 0;
    for (let i = 0; i < 7; i++) { const k = dateKey(addDays(now, i)); byDay[k] = { key: k, i, runs: [] }; days.push(byDay[k]); }
    runs.forEach(r => {
      runById[r.id] = r;
      const d = byDay[r.date];
      if (!d || r.status === 'cancelled' || r.past) return;
      const involved = me && (r.host === me || r.joinedByMe || r.maybeByMe);
      if (r.faded && !involved) return;
      if (canSee(me, r)) d.runs.push(r); else hiddenTotal++;
    });
    days.forEach(d => d.runs.sort((a, b) => a.start - b.start || (a.status === 'locked' ? -1 : 1)));
    // Runs you host or joined this week, next one first. Dropped runs sink below live ones.
    const mine = me ? runs.filter(r => (r.host === me || r.joinedByMe) && r.status !== 'cancelled' && !r.past && byDay[r.date]) : [];
    mine.sort((a, b) => (a.faded === b.faded ? 0 : a.faded ? 1 : -1) || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || a.start - b.start);

    const fullNameOf = id => {
      const p = profiles[id];
      if (p && p.handle) return p.handle;
      const pp = Store.people[id];
      return (pp && pp.name) || (id === me ? 'You' : 'Someone');
    };
    // Bots keep their handle; people show as first name and last initial.
    const nameOf = id => (isSample(id) ? fullNameOf(id) : shortName(fullNameOf(id)));
    const mutuals = id => { if (!me) return []; const a = F(me), b = F(id), out = []; a.forEach(x => { if (b.has(x)) out.push(x); }); return out; };
    const relation = id => {
      if (!me || id === me) return 'me';
      if (F(me).has(id)) return 'friend';
      if (incoming.some(x => x.other === id)) return 'incoming';
      if (outgoing.some(x => x.other === id)) return 'outgoing';
      return 'none';
    };
    return {
      mode: Store.mode, ready: Store.ready(), canWrite: Store.canWrite && Store.mode !== 'loading', isOwner: Store.isOwner,
      homeLoaded: Store.mode === 'sandbox' || !!Store.loaded.home,
      me, meP, home: Store.home, profiles, F, incoming, outgoing, runs, runById, days, byDay, mine, todayK, samplesOn, hiddenTotal, friendCount: F1.size,
      nameOf, fullNameOf, mutuals, relation, realCount: Object.keys(profiles).filter(id => !isSample(id)).length,
    };
  }

  /* ---------------- Small pieces ---------------- */
  const I = {
    check: () => html`<svg class="ic" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7" /></svg>`,
    plus: () => html`<svg class="ic" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10" /></svg>`,
    search: () => html`<svg class="ic" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.6" /><path d="M10.4 10.4L14 14" /></svg>`,
    x: () => html`<svg class="ic" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8" /></svg>`,
    chevron: open => html`<svg class="ic" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style=${open ? 'transform:rotate(180deg)' : ''}><path d="M4 6l4 4 4-4" /></svg>`,
  };
  const VIS_OPTS = [['friends', 'Friends'], ['fof', 'Friends of friends'], ['wharton', 'All Wharton']];
  const VIS_HINT = { friends: 'Only your friends see it.', fof: 'Your friends and their friends see it.', wharton: 'Every Wharton student on In. sees it.' };
  const VIS_SEEN = { friends: 'Friends of the host', fof: 'Friends of friends', wharton: 'All Wharton' };
  const isProposed = r => r.status === 'intention' && !r.faded;
  // "2 going + 1 bot": bots never count as people.
  const countTxt = r => {
    const bots = r.joiners.filter(j => isSample(j.id)).length;
    const real = (r.host ? 1 : 0) + r.joiners.length - bots;
    return real + (r.faded ? ' said they’d be in' : isProposed(r) ? ' would be in' : ' going') + (bots ? ' + ' + bots + (bots === 1 ? ' bot' : ' bots') : '');
  };
  const routeTxt = r => startShort(r) + (r.finish ? ' → ' + shortPlace(r.finish) : ', out and back');
  const awayTxt = L => (L.toStart < 0.05 ? (L.corner ? 'Start: at your door' : 'Start: at your trail spot') : 'Start: ' + mi1(L.toStart) + ' mi away');
  // Who you want to run with. A run counts as "friends" if a friend is hosting or going, and so on out.
  const CIRCLES = [['friends', 'Friends'], ['fof', 'Friends of friends'], ['wharton', 'All Wharton']];
  const CIRCLE_RANK = { friends: 0, fof: 1, wharton: 2 };
  const CIRCLE_EMPTY = { friends: 'None of your friends are hosting or going ', fof: 'No friends or friends of friends are hosting or going ' };
  function whenRef(k, todayK) { const n = dayDiff(k, todayK); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'on ' + DOW_LONG[parseKey(k).getDay()]; }
  const lockRef = (r, todayK) => (dateKey(r.lockBy) === todayK ? '10 PM tonight' : '10 PM ' + DOW_LONG[r.lockBy.getDay()]);
  // "Leave by 6:20 AM · home by 7:35 AM". Clock times can pass midnight on late runs, so wrap them.
  const clockW = m => clock(((Math.round(m) % 1440) + 1440) % 1440);
  function tripTimes(L, proposed) {
    const w = proposed ? 'around ' : 'by ';
    return 'Leave ' + w + clockW(L.leaveAt) + ' · home ' + w + clockW(L.homeAt);
  }
  // "5 mi run + 0.6 mi walk": walking is split out so the total isn't read as running miles.
  function tripMiles(L) {
    const extra = L.toStart + L.homeLeg;
    if (extra < 0.05) return distTxt(L.run) + ' mi, door to door';
    return distTxt(L.run) + ' mi run + ' + mi1(extra) + ' mi ' + (L.mode === 'walk' ? 'walk' : 'jog');
  }
  function stateWord(r, M) {
    if (r.faded) return 'Dropped';
    if (r.host === M.me) return isProposed(r) ? 'You proposed it' : 'Hosting';
    return isProposed(r) ? 'You’d be in' : 'Joined';
  }

  function Avatar({ id, M, size }) {
    const sz = size || 26;
    const st = 'width:' + sz + 'px;height:' + sz + 'px;font-size:' + Math.round(sz * 0.4) + 'px;';
    const pp = Store.mode === 'live' && !isSample(id) ? Store.people[id] : null;
    if (pp && pp.avatarUrl && pp.avatarUrl.indexOf('data:') !== 0) return html`<img class="av" src=${pp.avatarUrl} alt="" style=${st} />`;
    const cls = 'av' + (id === M.me ? ' me' : isSample(id) ? ' sample' : '');
    return html`<span class=${cls} style=${st} aria-hidden="true">${initials(M.nameOf(id))}</span>`;
  }
  function Stack({ ids, M, size }) {
    return html`<span class="stack" aria-hidden="true">${ids.slice(0, 4).map(id => html`<${Avatar} key=${id} id=${id} M=${M} size=${size || 24} />`)}</span>`;
  }
  function Name({ id, M, full }) {
    return id === M.me ? 'You' : full ? M.fullNameOf(id) : M.nameOf(id);
  }
  const BotTag = () => html`<span class="sample-tag" title="Not a real person. Bots fill out runs during the beta.">Bot</span>`;
  // "hosted by Maya R." / "proposed by Priya S." / "you're hosting"
  // "Jason T. dropped out as host."
  const leftTxt = (r, M) => (r.leftBy === M.me ? 'You' : r.leftBy ? M.nameOf(r.leftBy) : 'The host') + ' dropped out as host.';
  function HostTxt({ r, M }) {
    const proposed = r.status === 'intention';
    if (!r.host) return 'needs a host';
    if (r.host === M.me) return proposed ? 'you proposed it' : 'you’re hosting';
    return html`${proposed ? 'proposed by ' : 'hosted by '}<${Name} id=${r.host} M=${M} />`;
  }
  function People({ r, M, size }) {
    const ids = [r.host].concat(r.joiners.map(j => j.id)).filter(Boolean);
    const mine = M.me ? M.F(M.me) : null;
    const pal = mine && !mine.has(r.host) && r.host !== M.me ? r.joiners.filter(j => mine.has(j.id)) : [];
    const palTxt = pal.length ? html` · <${Name} id=${pal[0].id} M=${M} />${pal.length > 1 ? ' + ' + (pal.length - 1) + (pal.length === 2 ? ' friend' : ' friends') : ''} ${isProposed(r) ? 'would be in' : pal.length > 1 ? 'are going' : 'is going'}` : null;
    const maybeTxt = r.maybes && r.maybes.length ? ' · ' + r.maybes.length + ' maybe' : '';
    return html`<${Stack} ids=${ids} M=${M} size=${size} /><span>${countTxt(r)}${maybeTxt} · <${HostTxt} r=${r} M=${M} />${palTxt}</span>`;
  }

  function Seg({ options, value, onChange, label }) {
    return html`<div class="seg" role="group" aria-label=${label}>${options.map(o => html`<button type="button" key=${String(o[0])} aria-pressed=${value === o[0]} disabled=${!!o[2]} onClick=${() => onChange(o[0])}>${o[1]}</button>`)}</div>`;
  }

  function Stepper({ id, value, onChange, step, min, max, fmt, label }) {
    return html`<div class="stepper" role="group" aria-label=${label}>
      <button type="button" aria-label=${'Lower ' + label} onClick=${() => onChange(Math.max(min, Math.round((value - step) * 10) / 10))}>−</button>
      <output id=${id} aria-live="polite">${fmt(value)}</output>
      <button type="button" aria-label=${'Raise ' + label} onClick=${() => onChange(Math.min(max, Math.round((value + step) * 10) / 10))}>+</button>
    </div>`;
  }

  function Sheet({ title, sub, onClose, children, bare }) {
    const ref = useRef(null);
    useEffect(() => {
      const onKey = e => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('keydown', onKey);
      const prev = document.activeElement;
      const el = ref.current && ref.current.querySelector(bare ? '.icon-btn' : 'input, select, .seg button');
      if (el && window.matchMedia && window.matchMedia('(min-width: 700px)').matches) { try { el.focus({ preventScroll: true }); } catch (e) {} }
      return () => { document.removeEventListener('keydown', onKey); if (prev && prev.focus) { try { prev.focus({ preventScroll: true }); } catch (e) {} } };
    }, []);
    return html`<div class="overlay" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" ref=${ref}>
        <div class=${'sheet-head' + (bare ? ' bare' : '')}>
          ${bare ? html`<h2 id="sheet-title">${title}</h2>` : html`<div><h2 id="sheet-title">${title}</h2>${sub ? html`<p class="sub">${sub}</p>` : null}</div>`}
          <button type="button" class="icon-btn" onClick=${onClose} aria-label="Close">${I.x()}</button>
        </div>
        ${children}
      </div>
    </div>`;
  }

  function TopBar({ M, onMe, onPost }) {
    return html`<header class="top"><div class="top-in">
      <div class="brand"><span class="mark" role="img" aria-label="In.">In<span class="dot"></span></span>${M.mode === 'sandbox' ? html`<span class="mode-chip" title="Your posts stay in this browser">Sandbox</span>` : null}<span class="brand-sub">Schuylkill River Trail · Wharton</span></div>
      <div class="top-r">
        ${M.canWrite ? html`<button class="btn btn-line btn-sm" onClick=${onPost}>${I.plus()}Post a run</button>` : null}
        ${M.canWrite || M.meP ? html`<button class="me-btn" onClick=${onMe} aria-label="Your runner card">${M.meP ? html`<${Avatar} id=${M.me} M=${M} size=${34} />` : html`<span class="me-setup">Set up</span>`}</button>` : null}
      </div>
    </div></header>`;
  }

  function Tabs({ tab, setTab, reqCount }) {
    const T = [['runs', 'Runs'], ['friends', 'Friends']];
    return html`<nav class="tabs" role="tablist" aria-label="Views">${T.map(t => html`<button key=${t[0]} role="tab" class="tab" aria-selected=${tab === t[0]} onClick=${() => setTab(t[0])}>${t[1]}${t[0] === 'friends' && reqCount ? html`<span class="badge" aria-label=${reqCount + ' friend requests'}>${reqCount}</span>` : null}</button>`)}</nav>`;
  }

  function NoteLine({ M }) {
    if (M.mode === 'live' && M.ready && !M.canWrite) {
      return html`<p class="noteline"><span>View only. Ask the owner for edit access to post and join runs.</span><button class="linkish" onClick=${() => Sandbox.init('readonly')}>Try the sandbox</button></p>`;
    }
    return null;
  }

  /* Your next run: the one block on the page with a strong treatment. */
  function YourRun({ r, M, onOpen, openLock }) {
    const isHost = r.host === M.me;
    const proposed = isProposed(r);
    const when = whenRef(r.date, M.todayK);
    let label, sub = null, cls = 'yr';
    if (r.faded) {
      cls += ' drop';
      label = 'Dropped ' + when;
      sub = (isHost ? 'You didn’t confirm' : r.host ? M.nameOf(r.host) + ' didn’t confirm' : 'Nobody confirmed') + ' it by 10 PM the night before, so it’s off.';
    } else if (isHost) {
      label = proposed ? 'You proposed a run ' + when : 'You’re hosting ' + when;
      if (proposed) {
        cls += ' tent';
        const n = r.joiners.length;
        sub = 'Confirm by ' + lockRef(r, M.todayK) + ' or it’s dropped. ' + (n ? n + (n === 1 ? ' person would' : ' people would') + ' be in.' : 'No one has said they’d be in yet.');
      }
    } else {
      label = proposed ? 'You’d be in ' + when : 'Your run ' + when + ' · Confirmed';
      if (proposed) cls += ' tent';
      if (!r.host) sub = leftTxt(r, M) + (proposed ? ' Someone has to take over and confirm it by ' + lockRef(r, M.todayK) + ', or it’s dropped. Open Details to take over.' : ' The run is still on. Open Details to take over as host.');
      else if (proposed) sub = M.nameOf(r.host) + ' confirms by ' + lockRef(r, M.todayK) + '. If it’s confirmed, you’re going. If not, it’s dropped.';
    }
    if (r.started && !r.faded) label = 'Running now';
    const t = clockParts(r.start);
    return html`<article class=${cls} aria-label=${label}>
      <p class="yr-k">${label}</p>
      <p class="yr-time">${proposed ? html`<span class="yr-around">around</span> ` : null}${t.hm} <small>${t.ap}</small></p>
      <h2 class="yr-t">${r.title}</h2>
      <p class="yr-pace">${pace(r.pace)}/mi · ${distTxt(r.dist)} mi</p>
      <p class="yr-l">${routeTxt(r)}</p>
      <p class="yr-soc"><${People} r=${r} M=${M} /></p>
      ${sub ? html`<p class="yr-sub">${sub}</p>` : null}
      <div class="yr-foot">
        ${r.legs && !r.faded ? html`<p class="yr-trip">${tripTimes(r.legs, proposed)}<span class="yr-trip-m">${tripMiles(r.legs)}</span></p>` : null}
        <div class="yr-act">
          ${isHost && proposed && M.canWrite ? html`<button class="btn btn-inv btn-sm" onClick=${() => openLock(r)}>Confirm run</button>` : null}
          <button class="btn btn-inv-line btn-sm" onClick=${() => onOpen(r)}>Details</button>
        </div>
      </div>
    </article>`;
  }

  function YourRuns({ M, onOpen, openLock }) {
    const mine = M.mine;
    if (!mine.length) return null;
    const rest = mine.slice(1);
    return html`<section class="yours" aria-label="Your runs">
      <${YourRun} key=${mine[0].id} r=${mine[0]} M=${M} onOpen=${onOpen} openLock=${openLock} />
      ${rest.length ? html`<ul class="yr-more" aria-label="Your other runs">${rest.map(r => html`<li key=${r.id}><button class="yr-more-b" onClick=${() => onOpen(r)}>
        <span class="yr-more-t">${dayDiff(r.date, M.todayK) === 0 ? 'Today' : dayDiff(r.date, M.todayK) === 1 ? 'Tmrw' : DOW[parseKey(r.date).getDay()]} ${clock(r.start)}</span>
        <span class="yr-more-n">${r.title}</span>
        <span class="yr-more-s">${stateWord(r, M)}</span>
      </button></li>`)}</ul>` : null}
    </section>`;
  }

  /* A run in the list: time and action on top, then what it is, pace, where, and who. */
  function Row({ r, M, onOpen, act, openLock }) {
    const isHost = r.host === M.me;
    const proposed = isProposed(r);
    let action = null;
    if (r.faded) action = html`<span class="row-note">Dropped</span>`;
    else if (isHost) action = proposed && M.canWrite ? html`<button class="btn btn-maybe btn-sm" onClick=${() => openLock(r)}>Confirm</button>` : html`<span class="state-chip">${proposed ? 'You proposed it' : 'Hosting'}</span>`;
    else if (r.joinedByMe) action = html`<span class="state-chip in">${I.check()}${proposed ? 'You’d be in' : 'Joined'}</span>`;
    else if (r.maybeByMe) action = html`<span class="state-chip">Maybe</span>`;
    else if (M.canWrite) {
      action = [
        html`<button key="m" class="btn btn-text btn-sm" onClick=${() => act.join(r, 'maybe')} aria-label=${'Maybe: ' + r.title}>Maybe</button>`,
        proposed
          ? html`<button key="i" class="btn btn-maybe btn-sm" onClick=${() => act.join(r)} aria-label=${'I’d be in: ' + r.title}>I’d be in</button>`
          : html`<button key="i" class="btn btn-go btn-sm" onClick=${() => act.join(r)} aria-label=${'I’m in: ' + r.title}>I’m in</button>`,
      ];
    }
    const mine = (isHost || r.joinedByMe) && !r.faded;
    return html`<li id=${'row-' + r.id} class=${'row' + (r.faded ? ' faded' : '') + (mine ? ' mine' : '')}>
      <div class="row-top">
        <p class="row-time"><b>${clock(r.start)}</b>${proposed ? html`<span class="tag">Proposed</span>` : null}${!r.host && !r.faded ? html`<span class="tag">Needs a host</span>` : null}</p>
        ${action ? html`<div class="row-act">${action}</div>` : null}
      </div>
      <h3 class="title"><button class="row-link" onClick=${() => onOpen(r)}>${r.title}</button></h3>
      <p class="pace">${pace(r.pace)}/mi · ${distTxt(r.dist)} mi</p>
      <p class="where">${routeTxt(r)}${r.legs ? html` · <span class="nw">${awayTxt(r.legs)}</span>` : null}</p>
      <p class="social"><${People} r=${r} M=${M} /></p>
    </li>`;
  }

  function Day({ d, M, now, onOpen, act, openLock, openPost, showRule, circle, widen, first }) {
    const [how, setHow] = useState(false);
    const lockBy = lockByFor(d.key);
    const tonight = d.i === 1 && now < lockBy;
    return html`<section class="day" aria-labelledby=${'day-' + d.key}>
      <div class="day-h"><h2 id=${'day-' + d.key}>${dayName(d.key, M.todayK)}</h2><span class="day-d">${dateTxt(d.key)}</span>${first ? html`<span class="day-sort">by start time</span>` : null}</div>
      ${showRule ? html`<div class="rule">
        <p>Proposed runs happen only if the host confirms by ${tonight ? html`10 PM tonight <span class="rule-left">(${dur(lockBy - now)} left)</span>` : '10 PM the night before'}. <button class="linkish" aria-expanded=${how} onClick=${() => setHow(!how)}>${how ? 'Hide' : 'How it works'}</button></p>
        ${how ? html`<p class="rule-more">Confirming sets the exact time and start. Everyone who tapped I’d be in is then going. If the host doesn’t confirm by 10 PM, the run is dropped. Confirmed runs take I’m in right up to the start.</p>` : null}
      </div>` : null}
      ${d.runs.length
        ? html`<ul class="rows">${d.runs.map(r => html`<${Row} key=${r.id} r=${r} M=${M} onOpen=${onOpen} act=${act} openLock=${openLock} />`)}</ul>`
        : d.total
          ? html`<p class="empty">${CIRCLE_EMPTY[circle] || 'Nothing '}${dayRef(d.key, M.todayK)} yet. <button class="linkish" onClick=${widen}>Show all Wharton</button></p>`
          : html`<p class="empty">Nothing posted for ${dayRef(d.key, M.todayK)} yet.${M.canWrite && M.meP ? html` <button class="linkish" onClick=${() => openPost({ date: d.key })}>Post the first run</button>` : null}</p>`}
    </section>`;
  }

  function RunList({ M, now, onOpen, act, openLock, openPost, goFriends, openProfile }) {
    const [circle, setCircleRaw] = useState(() => { const v = lsGet('in-circle'); return CIRCLE_RANK[v] != null ? v : 'wharton'; });
    const setCircle = v => { setCircleRaw(v); lsSet('in-circle', v); };
    if (!M.ready) return html`<ul class="rows" style="margin-top:40px">${[0, 1, 2, 3].map(i => html`<li key=${i} class="skel-row"></li>`)}</ul>`;
    const keep = r => r.host === M.me || r.joinedByMe || CIRCLE_RANK[r.circle] <= CIRCLE_RANK[circle];
    const days = M.days.map(d => Object.assign({}, d, { runs: d.runs.filter(keep), total: d.runs.length })).filter(d => d.i === 1 || d.runs.length);
    const ruleDay = days.find(d => d.runs.some(isProposed));
    const noFriends = circle !== 'wharton' && M.meP && !M.friendCount;
    return html`<div>
      <${NoteLine} M=${M} />
      ${M.canWrite && !M.meP ? html`<div class="setup"><span>Set up your runner card to post and join runs.</span><button class="btn btn-go btn-sm" onClick=${openProfile}>Set up</button></div>` : null}
      <${YourRuns} M=${M} onOpen=${onOpen} openLock=${openLock} />
      <div class=${'controls' + (M.mine.length ? ' after-yours' : '')}>
        <h2 class=${M.mine.length ? 'find-l' : 'vh'}>Find a run</h2>
        <div class="segc" role="group" aria-label="Show runs with">${CIRCLES.map(o => html`<button type="button" key=${o[0]} aria-pressed=${circle === o[0]} onClick=${() => setCircle(o[0])}>${o[1]}</button>`)}</div>
      </div>
      ${noFriends ? html`<p class="empty">You haven’t added friends yet. <button class="linkish" onClick=${goFriends}>Find friends</button></p>` : null}
      ${days.map(d => html`<${Day} key=${d.key} d=${d} M=${M} now=${now} onOpen=${onOpen} act=${act} openLock=${openLock} openPost=${openPost} showRule=${!!ruleDay && ruleDay.key === d.key} circle=${circle} widen=${() => setCircle('wharton')} first=${d === days[0]} />`)}
      ${M.hiddenTotal ? html`<p class="hidden-line">${M.hiddenTotal} more ${M.hiddenTotal === 1 ? 'run this week is' : 'runs this week are'} shared only with friends or friends of friends. ${M.meP ? html`<button class="linkish" onClick=${goFriends}>Find friends</button>` : null}</p>` : null}
    </div>`;
  }

  /* Door-to-door miles: one line, with the legs and the leave-time math one tap away. */
  function Trip({ L, proposed, M, act }) {
    const [open, setOpen] = useState(false);
    const how = L.mode === 'jog' ? 'jog' : 'walk';
    const legRow = (g, i) => html`<div class="leg" key=${i}><span>${g.label || g.from + ' → ' + g.to}${g.on ? html`<span class="m"> · ${g.on}</span>` : null}</span><span class="n">${mi1(g.mi)}</span></div>`;
    const mins = Math.max(1, Math.round(L.travelMin));
    return html`<section class="trip" aria-label="Your trip">
      <div class="trip-sum">
        <p>${tripTimes(L, proposed)}<span class="trip-m">${tripMiles(L)}</span></p>
        <button class="btn btn-text btn-sm" aria-expanded=${open} onClick=${() => setOpen(!open)}>${open ? 'Hide the legs' : 'Show the legs'}${I.chevron(open)}</button>
      </div>
      ${open ? html`<div class="legs">
        ${L.there.length ? html`<p class="leg-h">Getting there, ${how === 'walk' ? 'walking' : 'jogging'}</p>` : null}
        ${L.there.map(legRow)}
        <p class="leg-h">The run</p>
        ${legRow(L.runRow, 'run')}
        ${L.back.length ? html`<p class="leg-h">Getting home, ${how === 'walk' ? 'walking' : 'jogging'}</p>` : null}
        ${L.back.map(legRow)}
        <div class="leg leg-tot"><span>Total</span><span class="n">${mi1(L.total)}</span></div>
        <p class="hint">${L.toStart < 0.05
          ? (L.corner ? 'The run starts at your door' : 'The run starts where you meet the trail') + ', so the leave time is just a few minutes early, rounded down to the nearest 5.'
          : 'Leave time: about ' + mins + ' min to ' + how + ' ' + mi1(L.toStart) + ' mi at ' + pace(L.speed) + '/mi, plus a few minutes to spare, rounded down to the nearest 5.'} Home time: the run itself (${distTxt(L.run)} mi at ${pace(Math.round(L.runMin * 60 / Math.max(L.run, 0.1)))}/mi, about ${Math.round(L.runMin)} min)${L.homeLeg >= 0.05 ? ', then about ' + Math.max(1, Math.round(L.homeMin)) + ' min to ' + how + ' ' + mi1(L.homeLeg) + ' mi home' : ''}, rounded up to the nearest 5. Distances are approximate: city blocks on the street grid, miles along the trail.${L.hasDoor ? '' : ' Set your nearest corner on your runner card to count the miles from your door.'}</p>
        ${M.canWrite && M.meP ? html`<div class="trip-mode"><span class="lbl">To and from runs</span><${Seg} label="To and from runs" value=${how} onChange=${v => act.setTravel(v)} options=${[['walk', 'Walk'], ['jog', 'Jog']]} /></div>` : null}
      </div>` : null}
    </section>`;
  }

  function RunDetail({ r, M, now, act, openLock, openPost }) {
    const [ask, setAsk] = useState(null);  // 'cancel' or 'leave' while the host confirms
    if (!r) return html`<div class="detail sheet-body-pad"><p class="d-state prop">Gone</p><p class="empty">This run is no longer on the board.</p></div>`;
    if (r.status === 'cancelled') return html`<div class="detail sheet-body-pad"><p class="d-state prop">Cancelled</p><p class="empty">The host cancelled this run.</p></div>`;
    const isHost = r.host === M.me;
    const proposed = isProposed(r);
    const t = clockParts(r.start);
    const day = dayName(r.date, M.todayK) + ', ' + dateTxt(r.date);
    let state;
    if (r.faded) state = 'Dropped · not confirmed by 10 PM · ' + day;
    else if (proposed) state = 'Proposed · ' + day;
    else state = 'Confirmed · ' + day + (r.started ? ' · running now' : '');
    let next = null;
    if (!r.host && !r.faded) {
      next = leftTxt(r, M) + (proposed ? ' Anyone who can see this run can take it over, and has to confirm it by ' + lockRef(r, M.todayK) + ' or it’s dropped.' : ' The run is still on. Anyone who can see it can take over as host.');
    } else if (proposed) {
      next = isHost
        ? 'Confirm by ' + lockRef(r, M.todayK) + ' to set the exact time and start. Everyone who said I’d be in is then going. If you don’t confirm, the run is dropped.'
        : M.nameOf(r.host) + ' confirms by ' + lockRef(r, M.todayK) + ' and sets the exact time and start. If you said I’d be in, you’re then going. If it isn’t confirmed, the run is dropped.';
    }
    let actions = null;
    if (M.canWrite) {
      if (isHost) {
        if (r.faded) actions = html`<button class="btn btn-go" onClick=${() => openPost({ from: r, kind: 'locked' })}>Repost it confirmed</button>`;
        else if (ask === 'cancel') {
          actions = [
            html`<span key="c">Cancel this run?</span>`,
            html`<button key="y" class="btn btn-line btn-sm btn-danger" onClick=${() => { setAsk(null); act.cancel(r); }}>Yes, cancel it</button>`,
            html`<button key="n" class="btn btn-text btn-sm" onClick=${() => setAsk(null)}>Keep it</button>`,
          ];
        } else if (ask === 'leave') {
          actions = [
            html`<span key="c">Drop out as host? The run stays up and anyone going can take over.</span>`,
            html`<button key="y" class="btn btn-line btn-sm" onClick=${() => { setAsk(null); act.stepDown(r); }}>Yes, drop out</button>`,
            html`<button key="n" class="btn btn-text btn-sm" onClick=${() => setAsk(null)}>Keep hosting</button>`,
          ];
        } else {
          // Hosts can drop out once someone else is in (or a maybe); on their own, cancelling is the way out.
          const others = r.joiners.filter(j => !isSample(j.id)).length + r.maybes.length;
          actions = [
            proposed ? html`<button key="l" class="btn btn-go" onClick=${() => openLock(r)}>Confirm run</button>` : null,
            html`<button key="e" class="btn btn-line" onClick=${() => openPost({ edit: r })}>Edit</button>`,
            others ? html`<button key="d" class="btn btn-text" onClick=${() => setAsk('leave')}>Drop out</button>` : null,
            html`<button key="x" class="btn btn-text" onClick=${() => setAsk('cancel')}>Cancel run</button>`,
          ];
        }
      } else if (!r.faded) {
        const take = !r.host ? html`<button key="t" class="btn btn-go" onClick=${() => act.takeOver(r)}>Take over as host</button>` : null;
        const inBtn = proposed
          ? html`<button key="i" class=${'btn btn-maybe' + (take ? '' : ' btn-lg')} onClick=${() => act.join(r)}>I’d be in</button>`
          : html`<button key="i" class=${take ? 'btn btn-line' : 'btn btn-go btn-lg'} onClick=${() => act.join(r)}>I’m in</button>`;
        if (r.joinedByMe) {
          actions = [
            html`<span key="in" class="in-mark"><i></i>${proposed ? 'You’d be in' : 'You’re going'}</span>`, take,
            html`<button key="m" class="btn btn-text" onClick=${() => act.join(r, 'maybe')}>Change to maybe</button>`,
            html`<button key="out" class="btn btn-text" onClick=${() => act.leave(r)}>Drop out</button>`,
          ];
        } else if (r.maybeByMe) {
          actions = [
            html`<span key="mb" class="in-mark maybe"><i></i>You’re a maybe</span>`, take, inBtn,
            html`<button key="out" class="btn btn-text" onClick=${() => act.leave(r)}>Not going</button>`,
          ];
        } else {
          actions = [take, inBtn, html`<button key="m" class="btn btn-text" onClick=${() => act.join(r, 'maybe')}>Maybe</button>`];
        }
      }
    }
    const going = [r.host].concat(r.joiners.map(j => j.id)).filter(Boolean);
    const sp = PLACE[r.placeId], fp = PLACE[r.finishId], tf = trailFinish(r);
    const startSub = [sp ? sp.where : r.place ? mi1(r.placeOff) + ' mi off the trail, near ' + spotName(r.spot) : 'On the trail', r.legs && !r.faded ? mi1(r.legs.toStart) + ' mi from you' : null].filter(Boolean).join(' · ');
    const homeSub = r.legs && !r.faded ? mi1(r.legs.homeLeg) + ' mi from your door' : null;
    const finishSub = [fp ? fp.where : tf ? 'On the trail' : mi1(r.finishOff) + ' mi off the trail, near ' + spotName(r.finishSpot || r.spot), homeSub].filter(Boolean).join(' · ');
    return html`<article class="detail sheet-body-pad">
      <p class=${'d-state' + (proposed || r.faded ? ' prop' : '')}>${state}</p>
      <p class="d-time">${proposed ? html`<span class="d-around">around</span> ` : null}${t.hm} <small>${t.ap}</small></p>
      <h3 class="d-title">${r.title}</h3>
      <p class="d-pace">${pace(r.pace)}/mi · ${distTxt(r.dist)} mi</p>
      ${next ? html`<p class="d-next">${next}</p>` : null}
      ${actions ? html`<div class="d-actions">${actions}</div>` : null}
      <dl class="d-rows">
        <div><dt>${proposed ? 'Would be in' : 'Going'}</dt><dd>${going.length ? html`<span class="who"><${Stack} ids=${going} M=${M} size=${24} /><span>${going.map((id, i) => html`<span key=${id}>${i ? ', ' : ''}<${Name} id=${id} M=${M} full=${true} />${id === r.host ? ' (host)' : ''}${isSample(id) ? html`<${BotTag} />` : null}</span>`)}</span></span>` : 'No one yet'}</dd></div>
        ${r.maybes.length ? html`<div><dt>Maybe</dt><dd>${r.maybes.map((j, i) => html`<span key=${j.id}>${i ? ', ' : ''}<${Name} id=${j.id} M=${M} full=${true} /></span>`)}</dd></div>` : null}
        <div><dt>Start</dt><dd>${startLabel(r)}<span class="m">${startSub}</span></dd></div>
        <div><dt>Finish</dt><dd>${r.finish ? html`${r.finish}<span class="m">${finishSub}</span>` : html`Back at the start<span class="m">Out and back</span>`}</dd></div>
        ${r.note ? html`<div><dt>Note</dt><dd>${r.note}</dd></div>` : null}
        <div><dt>Seen by</dt><dd>${VIS_SEEN[r.vis] || VIS_SEEN.fof}</dd></div>
      </dl>
      ${r.legs && !r.faded ? html`<${Trip} key=${r.id} L=${r.legs} proposed=${proposed} M=${M} act=${act} />` : null}
      ${Store.cloud && M.mode === 'live' ? html`<${Chat} key=${'chat-' + r.id} r=${r} M=${M} act=${act} />` : null}
    </article>`;
  }

  // "7:05 AM", "Yesterday 9:40 PM", "Mon 6:15 AM"
  function msgTime(ms, todayK) {
    const d = new Date(ms), n = dayDiff(dateKey(d), todayK);
    return (n === 0 ? '' : n === -1 ? 'Yesterday ' : DOW[d.getDay()] + ' ') + clock(d.getHours() * 60 + d.getMinutes());
  }

  /* Chat on a run: everyone who can see the run can read it and post. */
  function Chat({ r, M, act }) {
    const [text, setText] = useState('');
    const [busy, setBusy] = useState(false);
    const listRef = useRef(null);
    useEffect(() => { Cloud.openThread(r.id); return () => Cloud.closeThread(); }, [r.id]);
    const th = Store.thread && Store.thread.runId === r.id ? Store.thread : null;
    const items = th ? th.items : [];
    useEffect(() => { const el = listRef.current; if (el) el.scrollTop = el.scrollHeight; }, [items.length]);
    const send = async e => {
      e.preventDefault();
      const body = text.trim();
      if (!body || busy) return;
      setBusy(true);
      const ok = await act.sendMessage(r, body);
      setBusy(false);
      if (ok) setText('');
    };
    return html`<section class="chat" aria-label="Chat">
      <h4 class="chat-h">Chat</h4>
      ${!th || !th.loaded
        ? html`<p class="hint">Loading messages…</p>`
        : items.length
          ? html`<ol class="chat-list" ref=${listRef}>${items.map(m => html`<li key=${m.id} class="msg">
              <${Avatar} id=${m.user} M=${M} size=${26} />
              <div class="msg-b">
                <p class="msg-h"><b><${Name} id=${m.user} M=${M} /></b> ${msgTime(m.at, M.todayK)}${m.user === M.me ? html`<button type="button" class="linkish msg-x" onClick=${() => act.deleteMessage(m)}>Delete</button>` : null}</p>
                <p class="msg-text">${m.body}</p>
              </div>
            </li>`)}</ol>`
          : html`<p class="hint">No messages yet. Ask about the plan, or say you’re running late.</p>`}
      ${M.canWrite && M.meP ? html`<form class="chat-form" onSubmit=${send}>
        <label class="sr-only" for=${'chat-' + r.id}>Message</label>
        <textarea id=${'chat-' + r.id} rows="2" maxlength="500" placeholder="Message everyone on this run" value=${text} onInput=${e => setText(e.target.value)}></textarea>
        <button type="submit" class="btn btn-go btn-sm" disabled=${busy || !text.trim()}>Send</button>
      </form>` : null}
    </section>`;
  }

  function authMsg(x) {
    const m = String((x && x.message) || '');
    if (/rate|seconds|too many/i.test(m)) return 'Too many tries. Wait a minute, then try again.';
    if (/expired|invalid|otp/i.test(m)) return 'That code didn’t work. It may have expired, so send a new one.';
    if (/provider is not enabled|unsupported provider/i.test(m)) return 'Google sign-in isn’t switched on yet. Use your email instead.';
    if (/signups? not allowed|limited to/i.test(m)) return 'This email can’t sign up for In.';
    if (/fetch|network/i.test(m)) return 'Can’t reach In. right now. Check your connection.';
    return m || 'Something went wrong. Try again.';
  }

  function SignIn() {
    const cfg = window.IN_CONFIG || {};
    const [email, setEmail] = useState(() => lsGet('in-last-email') || '');
    const [sent, setSent] = useState(false);
    const [code, setCode] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState(Store.authError || '');
    const [wait, setWait] = useState(0);
    useEffect(() => { if (!wait) return undefined; const t = setTimeout(() => setWait(w => Math.max(0, w - 1)), 1000); return () => clearTimeout(t); }, [wait]);
    const addr = email.trim().toLowerCase();
    const send = async e => {
      if (e) e.preventDefault();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)) { setErr('Enter your email address.'); return; }
      setBusy(true); setErr('');
      try { await Cloud.sendCode(addr); lsSet('in-last-email', addr); setSent(true); setCode(''); setWait(60); }
      catch (x) { setErr(authMsg(x)); }
      setBusy(false);
    };
    const verify = async e => {
      e.preventDefault();
      const t = code.replace(/\D/g, '');
      if (t.length < 6) { setErr('Enter the code from the email.'); return; }
      setBusy(true); setErr('');
      try { await Cloud.verifyCode(addr, t); } catch (x) { setErr(authMsg(x)); setBusy(false); }
    };
    const google = async () => { setErr(''); try { await Cloud.google(); } catch (x) { setErr(authMsg(x)); } };
    return html`<main class="signin">
      <div class="signin-in">
        <span class="mark" role="img" aria-label="In.">In<span class="dot"></span></span>
        <p class="lede">Plan tomorrow’s run with friends on the Schuylkill River Trail. See who’s going, say I’m in, and get a leave-by time from your door.</p>
        <section class="signin-card" aria-labelledby="signin-h">
          ${sent ? html`
            <h1 id="signin-h">Check your email</h1>
            <p class="hint">We sent a sign-in code to <b>${addr}</b>. Type it here, or tap the link in the email on this device.</p>
            <form class="form" onSubmit=${verify}>
              <div class="field"><label for="si-code">Code</label>
                <input id="si-code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" value=${code} onInput=${e => { setCode(e.target.value); setErr(''); }} /></div>
              ${err ? html`<p class="err" role="alert">${err}</p>` : null}
              <button type="submit" class="btn btn-go btn-lg btn-block" disabled=${busy}>Sign in</button>
            </form>
            <p class="hint signin-alt">
              <button type="button" class="linkish" disabled=${!!wait || busy} onClick=${() => send()}>${wait ? 'Send a new code in ' + wait + 's' : 'Send a new code'}</button>
              <span aria-hidden="true"> · </span>
              <button type="button" class="linkish" onClick=${() => { setSent(false); setErr(''); }}>Use a different email</button>
            </p>`
          : html`
            <h1 id="signin-h">Sign in</h1>
            ${cfg.google ? html`<button type="button" class="btn btn-line btn-lg btn-block" onClick=${google}>Continue with Google</button><p class="or">or</p>` : null}
            <form class="form" onSubmit=${send}>
              <div class="field"><label for="si-email">Email</label>
                <input id="si-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" value=${email} onInput=${e => { setEmail(e.target.value); setErr(''); }} /></div>
              ${err ? html`<p class="err" role="alert">${err}</p>` : null}
              <button type="submit" class="btn btn-go btn-lg btn-block" disabled=${busy}>Email me a sign-in code</button>
            </form>
            <p class="hint">New here? The same code creates your account.</p>`}
        </section>
        <p class="hint signin-foot">In. is a student project for Wharton runners, not affiliated with the Wharton School.</p>
      </div>
    </main>`;
  }

  function PersonRow({ id, M, children, via }) {

    const bits = [p.pace ? pace(p.pace) + '/mi easy' : null, isFriend && SPOT[p.spot] ? 'meets the trail at ' + SPOT[p.spot].short : null].filter(Boolean);

      </div>

  function FriendsView({ M, act, openProfile }) {
    const [q, setQ] = useState('');
    const [confirmId, setConfirmId] = useState(null);
    if (!M.ready) return html`<ul class="rows" style="margin-top:40px">${[0, 1, 2].map(i => html`<li key=${i} class="skel-row"></li>`)}</ul>`;
    if (!M.meP) {
      return html`<div class="setup"><span>Set up your runner card to add friends. Friends see your friends-only runs, and their friends see your friends-of-friends runs.</span>${M.canWrite ? html`<button class="btn btn-line btn-sm" onClick=${openProfile}>Set up</button>` : null}</div>`;
    }
    const me = M.me;
    const byName = (a, b) => M.fullNameOf(a).localeCompare(M.fullNameOf(b));
    const friends = Array.from(M.F(me)).filter(id => M.profiles[id] && !isSample(id)).sort(byName);
    const incoming = M.incoming.filter(x => M.profiles[x.other]);
    const outgoingBy = {};
    M.outgoing.forEach(x => { outgoingBy[x.other] = x; });
    const ql = q.trim().toLowerCase();
    const others = Object.keys(M.profiles)
      .filter(id => id !== me && !isSample(id) && (M.relation(id) === 'none' || M.relation(id) === 'outgoing'))
      .filter(id => !ql || M.fullNameOf(id).toLowerCase().indexOf(ql) !== -1)
      .map(id => ({ id, mut: M.mutuals(id) }))
      .sort((a, b) => b.mut.length - a.mut.length || byName(a.id, b.id));
    return html`<div>
      ${incoming.length ? html`<section>
        <h2 class="section-title">Requests</h2>
        <ul class="flist">${incoming.map(x => html`<${PersonRow} key=${x.other} id=${x.other} M=${M}>
          <button class="btn btn-go btn-sm" onClick=${() => act.accept(x)}>Accept</button>
          <button class="btn btn-text btn-sm" onClick=${() => act.decline(x)}>Decline</button>
        <//>`)}</ul>
      </section>` : null}
      <section>
        <h2 class="section-title">Friends<span class="count">${friends.length}</span></h2>
        ${friends.length ? html`<ul class="flist">${friends.map(id => html`<${PersonRow} key=${id} id=${id} M=${M}>
          ${confirmId === id
            ? [html`<button key="r" class="btn btn-line btn-sm btn-danger" onClick=${() => { setConfirmId(null); act.unfriend(id); }}>Remove</button>`, html`<button key="k" class="btn btn-text btn-sm" onClick=${() => setConfirmId(null)}>Keep</button>`]
            : html`<button class="btn btn-text btn-sm" onClick=${() => setConfirmId(id)}>Remove</button>`}
        <//>`)}</ul>` : html`<p class="empty">No friends yet. Add a few classmates below. Their runs, and their friends' runs, then show up on your board.</p>`}
      </section>
      <section>
        <h2 class="section-title">Find classmates</h2>
        <label class="search" for="find-q">${I.search()}<input id="find-q" type="search" placeholder="Search by name" autocomplete="off" value=${q} onInput=${e => setQ(e.target.value)} /></label>
        ${others.length ? html`<ul class="flist">${others.map(o => html`<${PersonRow} key=${o.id} id=${o.id} M=${M} via=${o.mut}>
          ${outgoingBy[o.id]
            ? [html`<span key="p" class="pending">Requested</span>`, html`<button key="c" class="btn btn-text btn-sm" onClick=${() => act.cancelRequest(outgoingBy[o.id])}>Cancel</button>`]
            : html`<button class="btn btn-line btn-sm" onClick=${() => act.request(o.id)} aria-label=${'Add ' + M.fullNameOf(o.id)}>${I.plus()}Add</button>`}
        <//>`)}</ul>` : html`<p class="empty">${ql ? 'No one by that name on In. yet.' : M.realCount <= 1 ? 'No one else is on In. yet. Send friends the link and they’ll show up here.' : 'You’re connected with everyone on In. so far.'}</p>`}
      </section>
    </div>`;
  }
